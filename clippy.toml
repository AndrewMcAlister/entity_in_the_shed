# How_To_Code.md principle 5: any function longer than this is reviewed.
# Paired with `too_many_lines = "deny"` in Cargo.toml's [workspace.lints.clippy].
too-many-lines-threshold = 50

# Two more rules are enforced by tests rather than by clippy, because clippy has no
# way to express them. Both live in the shed-gates crate:
#   crates/shed-gates/src/layers.rs  - the crate dependency direction in
#                        docs/ARCHITECTURE.md, and the rule that only shed-config reads
#                        the environment (principle 19, principle 24).
#   crates/shed-gates/src/assets.rs  - the frozen client is byte-for-byte unchanged
#                        (decision D2).
