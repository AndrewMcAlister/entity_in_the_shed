          setStatus('Could not change chatterbox mode.');
        }
      });
    }

    if (handsFreeToggle) {
      handsFreeToggle.addEventListener('change', async () => {
        const enabled = handsFreeToggle.checked;
        try { window.localStorage.setItem(handsFreeKey, enabled ? 'true' : 'false'); } catch (e) {}

        if (!enabled) {
          userStoppedListening = true;
          if (recording) {
            stopRecording();
          }
          setStatus('Hands-free off. Tap To Speak when you want to talk.');
          return;
        }

        userStoppedListening = false;
        fatalMicrophoneError = false;
        // Hands-free is turning the microphone on for the rest of the session,
        // so the box goes with it -- otherwise the next thing typed silently
        // disables the mode the user just switched on.
        inputOwnedByUser = false;
        // Seed auto-send, since hands-free is pointless without it.
        if (autoSendToggle && !autoSendToggle.checked) {
          autoSendToggle.checked = true;
          try { window.localStorage.setItem(autoSendKey, 'true'); } catch (e) {}
        }

        const hasPermission = await requestMicrophonePermission();
        if (!hasPermission) {
          handsFreeToggle.checked = false;
          try { window.localStorage.setItem(handsFreeKey, 'false'); } catch (e) {}
          return;
        }

        if (!recording) {
          startRecording();
        }
        setStatus('Hands-free on. Just talk — the mic reopens after each reply.');
      });
    }

    if (pauseBeforeReplySelect) {
      pauseBeforeReplySelect.addEventListener('change', () => {
        const value = Number(pauseBeforeReplySelect.value);
        silenceStopDelayMs = pauseBeforeReplyOptionsMs.includes(value) ? value : defaultPauseBeforeReplyMs;
        try { window.localStorage.setItem(pauseBeforeReplyKey, String(silenceStopDelayMs)); } catch (e) {}
        setStatus(`Pause before replying set to ${(silenceStopDelayMs / 1000).toFixed(1)}s.`);
      });
    }

    loadCharacterPicker();

    // The entity starts last, deliberately. Everything above this line is the
    // chatbot: the pickers, the transcript, the message box. Bringing the entity
    // up only once all of that is under way means no failure in it -- a blocked
    // storage, a refused stream, a state probe that never answers -- can leave
    // the page without the controls it already had. Not awaited, because none of
    // it should delay the page becoming usable.
    adoptStoredClientIdentity();
    void bootstrapProactiveDelivery();

    const infoIcon = document.getElementById('infoIcon');
    if (infoIcon) {
      infoIcon.addEventListener('click', (event) => {
        event.stopPropagation();
        infoIcon.classList.toggle('open');
      });
      document.addEventListener('click', (event) => {
        if (!infoIcon.contains(event.target)) {
          infoIcon.classList.remove('open');
        }
      });
    }

    if (characterInfoButton && characterInfoPanel) {
      characterInfoButton.addEventListener('click', (event) => {
        // stopPropagation so the document listener below does not read this very
        // click as the one that landed outside the panel.
        event.stopPropagation();
        setCharacterInfoOpen(characterInfoPanel.hidden);
      });
      document.addEventListener('click', (event) => {
        if (!characterInfoButton.contains(event.target)) {
          setCharacterInfoOpen(false);
        }
      });
    }

    micButton.addEventListener('click', async () => {
      if (recording) {
        // A deliberate stop: if nothing was captured there is no turn coming,
        // so hands-free must not switch the mic straight back on.
        userStoppedListening = true;
        stopRecording('user');
      } else {
        userStoppedListening = false;
        fatalMicrophoneError = false;
        // Asking for the microphone hands it the box, which is what makes the
        // transcript appear in it again after the user has been typing.
        inputOwnedByUser = false;
        // Request microphone permission before starting recording
        const hasPermission = await requestMicrophonePermission();
        if (hasPermission) {
          startRecording();
        }
      }
    });

    sendButton.addEventListener('click', sendMessage);
    interruptButton.addEventListener('click', interruptProcessing);
    repeatButton.addEventListener('click', async () => {
      if (!lastAssistantReply) {
        setStatus('No reply to repeat yet.');
        return;
      }

      repeatButton.disabled = true;
      interruptButton.disabled = false;
      setStatus('Repeating the last reply...');

      try {
        await speak(lastAssistantReply, lastAssistantReplyMode);
        setStatus(`Repeated the last ${formatDeliveryStyle(lastAssistantReplyMode)} reply.`);
      } catch (error) {
        if (error.name === 'AbortError') {
          return;
        }
        setStatus(`Repeat failed: ${error.message}`);
      } finally {
        repeatButton.disabled = false;
        if (!isSendingMessage) {
          interruptButton.disabled = true;
          // Repeat held the speaker outside a turn, so it is the flow that
          // releases anything the entity queued while it played.
          drainDeferredProactive();
          maybeResumeListening();
        }
      }
    });

    messageInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    // A keystroke takes the message box off the microphone. Only a user edit
    // fires this: the transcript dictation writes is a programmatic assignment,
    // which is exactly the discrimination the page needs and no other event
    // gives. Without it, hands-free -- which brings the microphone back after
    // every reply -- has dictation overwriting every character as it is typed.
    messageInput.addEventListener('input', () => {
      takeMessageBoxFromMicrophone();
      if (!dictationYieldsMicToTyping()) {
        return;
      }
      // Never auto-send: what was heard so far is not a sentence the user
      // finished, and they are in the middle of writing their own.
      stopRecording();
    });
  </script>
</body>
</html>
