<body>

    <section class="hero">
      <h1>The Entity in the Shed</h1>
      <p>....sends us messages through the ether</p>
      <p>(and your phone)</p>

             Models have been tuned but still larger models are slow, 9B gives a good response.
          </span>

        </div>

          <label class="toggle left"><input id="speakToggle" type="checkbox" checked> speak replies</label>
          <label class="toggle right"><input id="autoSendToggle" type="checkbox" checked> auto-send transcript</label>
          <label class="toggle left"><input id="handsFreeToggle" type="checkbox"> hands-free (keep mic on)</label>
          <label class="toggle right"><input id="textReportFormatToggle" type="checkbox"> Text Report Format</label>
          <label class="toggle left"><input id="spookyFartsToggle" type="checkbox" checked> spooky farts</label>
          <label class="toggle right"><input id="spookyLaughsToggle" type="checkbox" checked> spooky laughs</label>

        </div>
        <div class="field-group settings-field">
          <label for="pauseBeforeReplySelect">Pause before replying</label>
          <select id="pauseBeforeReplySelect" aria-label="Pause before replying">
              <option value="1000">Quick (1.0s)</option>
              <option value="1500">Standard (1.5s)</option>
              <option value="2000">Relaxed (2.0s)</option>
              <option value="2500">Long (2.5s)</option>

        </div>
        <div class="voice-row">
          <div class="field-group">
            <label for="languageSelect">My Language</label>
            <select id="languageSelect" aria-label="My language">
              <option value="en-GB">English</option>
              <option value="fr-FR">French</option>
              <option value="ja-JP">Japanese</option>
              <option value="es-ES">Spanish</option>
              <option value="de-DE">German</option>
              <option value="it-IT">Italian</option>
              <option value="pt-BR">Portuguese</option>
              <option value="zh-CN">Chinese (Mandarin)</option>
              <option value="ru-RU">Russian</option>
              <option value="ar-SA">Arabic</option>
              <option value="hi-IN">Hindi</option>
              <option value="ko-KR">Korean</option>
              <option value="nl-NL">Dutch</option>
              <option value="pl-PL">Polish</option>
              <option value="tr-TR">Turkish</option>
              <option value="ur-PK">Urdu</option>
              <option value="sv-SE">Swedish</option>
              <option value="nb-NO">Norwegian</option>
              <option value="da-DK">Danish</option>
              <option value="hr-HR">Croatian</option>
            </select>
          </div>
          <div class="field-group">
            <label for="countrySelect">Country</label>
            <select id="countrySelect" aria-label="Country selection">
              <option value="">None</option>
            </select>
          </div>
          <div class="field-group">
            <div class="character-label-row">
              <label for="voiceSelect">Character</label>
              <button id="characterInfoButton" type="button" class="info-icon character-info-icon" aria-label="About the selected character" aria-controls="characterInfoPanel" aria-expanded="false">
                <img src="/styles/information_info_1565.webp" width="18" height="18" alt="" aria-hidden="true">
              </button>
            </div>
            <select id="voiceSelect" aria-label="Character selection"></select>

          </div>
        </div>
        <div class="field-group settings-field password-group">
          <label for="passwordInput">Password (opt)</label>
          <div class="input-row">
            <input id="passwordInput" type="password" autocomplete="off" aria-label="Password optional">
            <button id="sendPasswordButton" class="secondary-button" type="button">Send Password</button>
          </div>
        </div>
      </div>

      <button id="restartBotButton" class="restart-bot-button" type="button" hidden aria-label="Restart The Entity In The Shed">Reboot The Entity In The Shed</button>
      <audio id="serverAudio" hidden preload="none"></audio>
      <audio id="effectAudio" hidden preload="none"></audio>
      <div id="conversation" class="conversation"></div>
      <footer class="page-credit">Voice technology by Microsoft.</footer>
    </section>

  <script>
    const mobileChatHelpers = window.MobileChatHelpers;
    let mcpAccessToken = mobileChatHelpers.readMcpAccessToken(window.sessionStorage);
    const modelSelectionRequiresPassword = {{ model_selection_requires_password|tojson }};

    function createRequestId() {
      return `${Date.now().toString(36)}-${Math.random().toString(16).slice(2)}`;
    }

    function buildJsonHeaders() {
      return {
        'Content-Type': 'application/json',
        'X-Request-ID': createRequestId()
      };
    }

    async function parseJsonResponseStrict(response, contextLabel) {
      const requestIdHeader = response.headers.get('X-Request-ID') || '';
      const contentType = String(response.headers.get('Content-Type') || '').toLowerCase();
      const rawText = await response.text();
      const bodySnippet = String(rawText || '').replace(/\s+/g, ' ').trim().slice(0, 180);

      if (!contentType.includes('application/json')) {
        throw new Error(
          `${contextLabel} returned non-JSON (status=${response.status}, content_type=${contentType || 'unknown'})`
          + (requestIdHeader ? ` (request_id=${requestIdHeader})` : '')
          + (bodySnippet ? `: ${bodySnippet}` : '')
        );
      }

      let payload;
      try {
        payload = rawText ? JSON.parse(rawText) : {};
      } catch (error) {
        throw new Error(
          `${contextLabel} returned invalid JSON`
          + (requestIdHeader ? ` (request_id=${requestIdHeader})` : '')
          + (bodySnippet ? `: ${bodySnippet}` : '')
        );
      }

      return payload;
    }

    function summarizeChatRequestError(error) {
      const raw = String(error && error.message ? error.message : error || '').trim();
      const normalized = raw.toLowerCase();

      if (normalized.includes('status=524') || normalized.includes('timed out') || normalized.includes('timeout')) {
        return {
          bubble: 'The request timed out while waiting for a reply. The model may be busy or asleep. Try again in a moment.',
          status: 'Request timed out (524). If this keeps happening, reload or switch to a lighter model.'
        };
      }

      if (
        normalized.includes('mem full')
        || normalized.includes('out of memory')
        || normalized.includes('insufficient memory')
        || normalized.includes('no models loaded')
        || normalized.includes('unloading model')
        || normalized.includes('model unloaded')
      ) {
        return {
          bubble: 'The model was unloaded or ran out of memory. Reload/select a model, then try again.',
          status: 'Model memory issue detected. Choose a lighter model or reload the current one.'
        };
      }

      if (normalized.includes('returned non-json') && normalized.includes('text/html')) {
        return {
          bubble: 'The server returned an upstream HTML error page instead of JSON. Please retry.',
          status: 'Upstream gateway error (HTML response). Try again shortly.'
        };
      }

      return {
        bubble: `Request failed: ${raw || 'Unknown error'}`,
        status: `Request failed: ${raw || 'Unknown error'}`
      };
    }

    function clearMcpAccessToken() {
      mcpAccessToken = mobileChatHelpers.clearMcpAccessToken(window.sessionStorage);
      if (document.getElementById('passwordInput')) {
        document.getElementById('passwordInput').value = '';
      }
      updateModelAccessUi();
    }

    function hasMcpAccess() {
      return Boolean((mcpAccessToken || '').trim());
    }

    function updateModelAccessUi() {
      const unlocked = hasMcpAccess();
      
      if (modelSelect) {
        modelSelect.disabled = false;
        modelSelect.style.display = 'inline-block';
      }
      if (modelLabel) {
        modelLabel.style.display = 'none';
      }
      if (restartBotButton) {
        restartBotButton.hidden = !unlocked;
        restartBotButton.disabled = !unlocked;
      }
      if (textReportFormatToggle) {
        const textReportLabel = textReportFormatToggle.closest('label') || textReportFormatToggle.parentElement;
        if (textReportLabel) {
          textReportLabel.hidden = !unlocked;
        }
      }
      populateModelSelect();
    }

    async function restartTheEntityInTheShed() {
      if (!hasMcpAccess()) {
        setStatus('Unlock protected actions first to restart The Entity In The Shed.');
        return;
      }

      if (!window.confirm('Restart The Entity In The Shed now? Chat will disconnect briefly.')) {
        return;
      }

      if (restartBotButton) {
        restartBotButton.disabled = true;
      }
      setStatus('Restarting The Entity In The Shed...');

      try {
        const response = await fetch('/api/restart', {
          method: 'POST',
          headers: buildJsonHeaders(),
          body: JSON.stringify({ mcp_token: mcpAccessToken })
        });

        let payload = {};
        try {
          payload = await parseJsonResponseStrict(response, 'Restart request');
        } catch (_) {
          payload = {};
        }

        if (!response.ok) {
          throw new Error(payload.error || payload.message || 'Restart request failed');
        }

        setStatus('The Entity In The Shed restart initiated. Wait a few seconds, then continue.');
      } catch (error) {
        const errorMessage = String((error && error.message) || '').toLowerCase();
        if (errorMessage.includes('failed to fetch') || errorMessage.includes('networkerror')) {
          setStatus('Restart command sent. Connection dropped while The Entity In The Shed restarted. Wait a few seconds.');
        } else {
          setStatus(`Restart failed: ${error.message}`);
        }
      } finally {
        window.setTimeout(() => {
          if (restartBotButton) {
            restartBotButton.disabled = !hasMcpAccess();
          }
        }, 4000);
      }
    }

    async function unlockMcpAccess() {
      const pwdInput = document.getElementById('passwordInput');
      const password = (pwdInput.value || '').trim();
      if (!password) {
        setStatus('Enter a password to unlock protected actions.');
        return;
      }
      
      setStatus('Unlocking protected actions...');
      try {
        const response = await fetch('/api/mcp/auth', {
          method: 'POST',
          headers: buildJsonHeaders(),
          body: JSON.stringify({ password })
        });
        
        const payload = await parseJsonResponseStrict(response, 'MCP auth');
        
        if (!response.ok || !payload.ok) {
          throw new Error(payload.error || 'Failed to unlock');
        }
        
        // Token is now cached server-side by IP, no need to store client-side
        // For backward compatibility, still store empty token if provided
        mcpAccessToken = mobileChatHelpers.storeMcpAccessToken(window.sessionStorage, payload.token || 'authenticated');
        pwdInput.value = '';
        setStatus('Protected actions unlocked.');
        updateModelAccessUi();
        if (!Array.isArray(modelLists.full) || !modelLists.full.length) {
          await loadAvailableModels();
        }
      } catch (error) {
        setStatus(`Unlock failed: ${error.message}`);
        clearMcpAccessToken();
      }
    }

    const micButton = document.getElementById('micButton');
    const sendButton = document.getElementById('sendButton');
    const interruptButton = document.getElementById('interruptButton');
    const repeatButton = document.getElementById('repeatButton');
    const messageInput = document.getElementById('messageInput');
    const conversation = document.getElementById('conversation');
    const statusBox = document.getElementById('statusBox');
    const autoSendToggle = document.getElementById('autoSendToggle');
    const speakToggle = document.getElementById('speakToggle');
    const proactiveToggle = document.getElementById('proactiveToggle');
    const handsFreeToggle = document.getElementById('handsFreeToggle');
    const pauseBeforeReplySelect = document.getElementById('pauseBeforeReplySelect');
    const textReportFormatToggle = document.getElementById('textReportFormatToggle');
    const spookyFartsToggle = document.getElementById('spookyFartsToggle');
    const spookyLaughsToggle = document.getElementById('spookyLaughsToggle');
    const deliveryStyleSelect = document.getElementById('deliveryStyleSelect');
    const modelSelect = document.getElementById('modelSelect');
    const modelLabel = document.getElementById('modelLabel');
    const passwordInput = document.getElementById('passwordInput');
    const sendPasswordButton = document.getElementById('sendPasswordButton');
    const restartBotButton = document.getElementById('restartBotButton');
    const languageSelect = document.getElementById('languageSelect');
    const countrySelect = document.getElementById('countrySelect');
    const voiceSelect = document.getElementById('voiceSelect');
    const characterInfoButton = document.getElementById('characterInfoButton');
    const characterInfoPanel = document.getElementById('characterInfoPanel');
    const serverAudio = document.getElementById('serverAudio');
    const effectAudio = document.getElementById('effectAudio');
    const textReportFormatKey = 'entity-text-report-format-enabled';
    const modelLists = {
      censored: [],
      full: []
    };
    updateModelAccessUi();
    const supportedLanguages = Object.freeze({
      'en-GB': { label: 'English', prefix: 'en' },
      'fr-FR': { label: 'French', prefix: 'fr' },
      'ja-JP': { label: 'Japanese', prefix: 'ja' },
      'es-ES': { label: 'Spanish', prefix: 'es' },
      'de-DE': { label: 'German', prefix: 'de' },
      'it-IT': { label: 'Italian', prefix: 'it' },
      'pt-BR': { label: 'Portuguese', prefix: 'pt' },
      'zh-CN': { label: 'Chinese (Mandarin)', prefix: 'zh' },
      'ru-RU': { label: 'Russian', prefix: 'ru' },
      'ar-SA': { label: 'Arabic', prefix: 'ar' },
      'hi-IN': { label: 'Hindi', prefix: 'hi' },
      'ko-KR': { label: 'Korean', prefix: 'ko' },
      'nl-NL': { label: 'Dutch', prefix: 'nl' },
      'pl-PL': { label: 'Polish', prefix: 'pl' },
      'tr-TR': { label: 'Turkish', prefix: 'tr' },
      'ur-PK': { label: 'Urdu', prefix: 'ur' },
      'sv-SE': { label: 'Swedish', prefix: 'sv' },
      'nb-NO': { label: 'Norwegian', prefix: 'nb' },
      'da-DK': { label: 'Danish', prefix: 'da' },
      'hr-HR': { label: 'Croatian', prefix: 'hr' }
    });
    const deliveryStyleSpeechSettings = Object.freeze({
      normal: { rate: 1.0, depth: 72, pitch: 1.0 },
      spooky: { rate: 0.85, depth: 40, pitch: 0.72 },
      shakespearean: { rate: 0.9, depth: 72, pitch: 1.0 },
      'in-love': { rate: 0.95, depth: 72, pitch: 1.1 }
    });

    // depth_delta is the server's pitch_delta in the same units; pitch_mult is

    const toneSpeechSettings = Object.freeze({
      alluring: { rate_mult: 0.9, pitch_mult: 0.9, depth_delta: -16, volume: 0.85 },
      whisper:  { rate_mult: 0.85, pitch_mult: 0.96, depth_delta: -6, volume: 0.5 },
      cheerful: { rate_mult: 1.08, pitch_mult: 1.04, depth_delta: 6, volume: 1.0 },
      somber:   { rate_mult: 0.85, pitch_mult: 0.93, depth_delta: -12, volume: 0.9 },
      excited:  { rate_mult: 1.15, pitch_mult: 1.05, depth_delta: 8, volume: 1.0 },
      stern:    { rate_mult: 0.9, pitch_mult: 0.95, depth_delta: -8, volume: 1.0 },
      soothing: { rate_mult: 0.9, pitch_mult: 0.97, depth_delta: -4, volume: 0.8 }
    });

    function getTextReportFormatEnabled() {
      return hasMcpAccess() && Boolean(textReportFormatToggle && textReportFormatToggle.checked);
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const voiceStorageKey = 'entity-selected-voice';
    const languageStorageKey = 'entity-selected-language';
    const spookyFartsKey = 'entity-spooky-farts';
    const spookyLaughsKey = 'entity-spooky-laughs';
    const speakToggleKey = 'entity-speak-replies';
    const autoSendKey = 'entity-auto-send';
    const handsFreeKey = 'entity-hands-free';
    const pauseBeforeReplyKey = 'entity-pause-before-reply';
    // How long a single utterance may be before it is cut. A browser utterance is
    // cut only so the first words start being heard sooner than a long paragraph
    // would allow. A server clip is cut to a much shorter limit, because the
    // server will not cache a clip past TTS_CACHE_MAX_TEXT_CHARS and an uncached
    // clip is re-synthesized on every play -- see mobileChatHelpers.splitSpeechIntoChunks.
    const BROWSER_SPEECH_CHUNK_CHARS = 420;
    const deliveryStyleOptions = Object.freeze(['normal', 'spooky', 'shakespearean', 'in-love']);
    const replyStartMessages = Object.freeze([
      'The veil trembles - @F something evil wafts into the room - who did it? Own up!',
      'The air chills - a spirit has joined the circle.',
      '@F An unseen gust bursts forth. Who was it?.....Own up!',
      'A wandering soul draws near. It seeks a voice.',
      'The boundary thins... someone wishes to speak.',
      'Hush now - the visitor has arrived.@F',
      'A gentle knock upon the veil... the spirit enters.',
      'The room stirs. A departed one stands at our threshold.',
      'The ether trembles - @F did somebody fart?',
      'The lantern dims. A soul steps into our company.',
      'A herald of the unseen descends into our midst.',
      'The luminous one crosses worlds to join this council.',
      'A voice older than breath awakens to commune. @F',
      'The astral witness unveils itself before us.',
      'The Eternal Listener has entered the chamber.',
      'A cold intelligence coils into the room.',
      'The Hollow One rises from the deep dark to speak.',
      'The Nameless Presence presses against the circle\'s edge.',
      'The air bends...@F I detect an entity... did someone fart?',
      'A whisper joins us...faint, but yearning.@F',
      'There... do you feel it? A spirit brushes past.',
      'A gentle soul steps through, seeking your words.',
      'The quiet visitor has entered. Be still.',
      'A memory made flesh drifts into our company.@F'
    ]);
    let recognition = null;
    let recording = false;
    let serverCharacters = [];
    let availableCountries = [];
    // Country -> characters already fetched, so switching back to a country
    // never refetches. Countries are loaded one at a time on demand. How long an
    // entry is trusted -- and why it is not trusted forever -- lives in
    // characterCacheEntryIsFresh, so the picker and its test share one authority.
    let characterCache = new Map();
    let characterRequestToken = 0;
    let browserVoices = [];
    let voicePollAttempts = 0;
    let currentAudioUrl = '';
    let activeUtterance = null;
    let currentCharacter = null;
    let deliveryStyle = 'Normal';
    // Whether the person chose a style on this page. Until they do, the turn
    // sends none and the server continues the style the conversation was last
    // delivered in -- the page deliberately keeps no style of its own across a
    // reload, and a default sent as if it were a choice would overwrite the
    // style the conversation remembers.
    let deliveryStyleChosen = false;
    let lastAssistantReply = '';
    let lastAssistantReplyMode = 'normal';
    let speakingReply = false;
    // Set when a reply could not be spoken; the status box keeps saying so until
    // the next turn. See setStatus.
    let speechFailure = '';
    let lastRecognitionError = '';
    let finalizedRecognitionTranscript = '';
    // What the user said before the current recognition session began. The
    // engine drops out mid-utterance and the page starts it again, and the new
    // session hears only the rest, so the words already spoken are held here to
    // be joined to what the new session finalizes.
    let recognitionCarriedTranscript = '';
    let activeRequestController = null;
    let interimRecognitionTranscript = '';
    let isSendingMessage = false;
    let activeReplyStartMessage = '';
    let activeReplyStartFart = false;
    let activeReplyStartFartAfterLoop = false;
    let activeReplyStartFartPlayed = false;
    let activeReplyStartFartTimer = 0;
    let silenceStopTimer = 0;
    let recognitionStallWatchdogTimer = 0;
    let recognitionLastActivityAtMs = 0;
    let recognitionStallRecoveryAttempts = 0;
    let recognitionStopFallbackTimer = 0;
    let listeningResumeTimer = 0;
    let recognitionStopRequested = false;
    // Who is waiting for the microphone to actually let go. `recognition.stop()`
    // is a request, not a result: a line about to be spoken into a hands-free
    // session has to wait for the engine's end event, or the first words land
    // while the microphone is still capturing them.
    let recognitionStopWaiters = [];
    // Why a stop asked for the turn to be sent, if one did: '' for a stop that
    // asked for nothing, 'user' for the microphone tapped off on purpose, 'pause'
    // for the silence pause running out. They are told apart because the auto-send
    // toggle may veto a pause but never the user's own action.
    let recognitionAutoSendReason = '';
    let pendingSilenceAutoSendTranscript = '';
    let lastTranscriptForSilenceTimer = '';
    // Whether the engine is still hearing the user speak. Recognition results
    // arrive in bursts from a server, so the transcript goes quiet between them
    // while the user is mid-sentence; this is the signal that says they have not
    // finished, and it is what the silence pause waits on.
    let recognitionHearingSpeech = false;
    // When the current silence pause first began waiting on that signal, so a
    // speech report that never ends cannot hold the microphone open for ever.
    let silenceStopWaitStartedAtMs = 0;
    // Hands-free: listening resumes by itself after each reply. These track why
    // it might need to stay quiet instead.
    let speechQueue = null;
    let userStoppedListening = false;
    let fatalMicrophoneError = false;
    // Who owns the message box: the keyboard or the microphone. Dictation writes
    // its transcript into the box as it goes, so a page that cannot tell the two
    // apart lets a recognition result overwrite what the user is typing -- and
    // in hands-free the microphone re-arms after every reply, so the overwriting
    // never stops. A keystroke sets this; asking for the microphone clears it.
    let inputOwnedByUser = false;
    // A reply whose sentences arrive over several polls, spoken as they land.
    let streamedSpeech = null;

    // reply must not cut it off. `prefaceSpeech` is that sequence as one
    // promise -- the reply's audio waits on it. `prefaceQueue` is the preface's
    // own queue, kept apart from `speechQueue` so an interrupt can still cut it
    // once the reply has claimed that slot.
    let prefaceSpeech = null;
    let prefaceQueue = null;
    // The durable identity. It names this browser to the server and is what its
    // conversation is stored under, so a returning visitor continues it while a
    // second computer behind the same router keeps its own.
    // Read from storage when it exists, otherwise minted and stored, and the
    // server echoes back whichever one it settled on.
    //
    // Declared empty and filled in at the very end of this script, not here.
    // Reading storage at this point would put the entity's identity ahead of
    // everything below it, and this is the top level: `window.localStorage`
    // throws outright when a browser blocks site data, so a single throw here
    // would take the model picker (line 1104) and the country picker (line 3464)

    let clientId = '';

    // by delivery id because delivery is at-least-once: a reconnect legitimately

    const seenDeliveryIds = new Set();
    // The highest seq rendered, sent back as ?since= so a reconnect does not
    // replay the backlog. Zero means "has not seen anything yet".
    let lastDeliveredSeq = 0;
    // Lines accepted while the speaker is owned by a reply, waiting for it. The
    // whole delivery is held -- bubble, ack and voice -- so the transcript keeps
    // its order and "spoke up" is only ever said of a line that was heard.
    let deferredProactive = []; // [{ message, mode }]
    let drainingDeferredProactive = false;
    let entityStream = null;
    let outboxPollTimer = 0;
    let outboxPollAttempts = 0;

    function safeLocalStorage() {
      // Accessing `window.localStorage` *itself* throws when a browser blocks
      // site data. That happens at the call site, so the helpers' own try/catch
      // around getItem/setItem never sees it -- the guard has to be here. A null
      // storage is already handled: reads fall back to the default and writes
      // become no-ops, so the identity simply does not outlive the page.
      try {
        return window.localStorage;
      } catch (error) {
        return null;

        // storage. Either way an identity is optional; the server mints one.

      // to be unique among this browser's own tabs, so the fallback is fine --
      // and the server replaces anything malformed rather than refusing a turn.
      try {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {

        if (window.crypto && typeof window.crypto.getRandomValues === 'function') {

          window.crypto.getRandomValues(bytes);
          return Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join('');

      // localStorage costs this tab nothing but a new identity -- and persisting

      // mint a different one.

        safeLocalStorage(),

      // voice sits deeper (or higher) without disturbing how the styles behave.

      const basePitch = clampSpeechValue(getEffectiveSpeechPitch(mode) * getSelectedCharacterPitchMultiplier(), 0.25, 2.0);

        // longer. The floor sits below the slowest style's rate, so the factor
        // is what decides the length rather than the clamp.

          rate: clampSpeechValue(baseRate * VOCALIZATION_RATE_FACTOR, 0.2, 1.0),

          depth: baseDepth,

        // "(x)" -- asks for one thing, so they share one profile. In Love wants
        // its asides whispered, so there a marked sentence is slower and deeper
        // instead of quicker and higher.

          rate: markedRate,
          pitch: clampSpeechValue(basePitch + 0.26, 0.5, 2.0),

        };

          rate: clampSpeechValue(baseRate * 0.9, 0.6, 1.3),
          pitch: clampSpeechValue(basePitch - 0.14, 0.35, 1.9),
          depth: clampSpeechValue(baseDepth - 10, 25, 130),

      }

        rate: baseRate,
        pitch: basePitch,
        depth: baseDepth,
      };
    }

    function normalizeToneName(name) {

        rate: clampSpeechValue(profile.rate * tone.rate_mult, 0.55, 1.6),
        pitch: clampSpeechValue(profile.pitch * tone.pitch_mult, 0.25, 2.0),

    async function loadAvailableModels() {

            if (!m) return null;
            if (typeof m === 'string') return { key: m, display: m };
            if (typeof m === 'object') {
              const k = m.key || m.id || m.model || '';
              const disp = m.display || m.display_name || m.name || k || String(m);

        const label = (typeof model === 'string') ? model : (model.display || model.key || String(model));
        option.value = key;
        option.textContent = label;
        modelSelect.appendChild(option);

        const restoredIndex = sourceModels.findIndex(model => {
          const key = (typeof model === 'string') ? model : (model.key || String(model));

          .then(async response => {

        .replace(/^Microsoft\s+/i, '')
        .replace(/\s+Online(?:\s*\([^)]*\))?/gi, '')
        .replace(/\s*\(Natural\)/gi, '')
        .replace(/\s*\((?:server|edge|windows|browser)\/[a-z]{2}(?:-[a-z]{2})?\)\s*$/i, '')

        .replace(/Multilingual/gi, '')

    function getAllCharacters() {

      // preserving how multilingual variants collapse.

      // voice — e.g. the multilingual "Vivienne" — is accidentally dropped.
      const results = [];
      const byKey = new Map();

        const locale = (normalizeLocale(character.culture || character.lang || character.locale || '') || '').toLowerCase();

        // Keep every French voice; never de-duplicate them.
        if (locale === 'fr' || locale.startsWith('fr-')) {
          results.push(character);
          return;
        }

        const key = mobileChatHelpers.dedupeKeyFor(character);
        const index = byKey.get(key);

      // watched -- the speech fallback needs them -- but they are not characters
      // and never appear in the picker.

      const rightDisplay = formatVoiceDisplayName(right) || '';

        const match = text.match(/\(([^)]+)\)/);
        return match ? match[1].trim() : text;
      };

      const leftBracket = extractBracketText(leftDisplay);
      const rightBracket = extractBracketText(rightDisplay);

        return leftBracket.localeCompare(rightBracket);
      }

      return leftDisplay.localeCompare(rightDisplay);

    let lastRenderedVoicesHash = '';

    function renderVoiceOptions() {
      const isPollingBrowserVoices = !browserVoices.length && voicePollAttempts > 0 && voicePollAttempts < 12;

      const allVoices = getAllCharacters().slice().sort(compareVoices);

      // Rebuild the country list only when it actually changes. Rewriting it on
      // every render destroys the open dropdown while browser voices are being
      // polled, which makes the country impossible to change.
      const countriesHash = availableCountries.join('|');
      if (countriesHash !== lastRenderedCountriesHash) {
        lastRenderedCountriesHash = countriesHash;
        // The country last used in this browser is resumed, so a reload comes
        // back to where it left off rather than to an empty picker. A country
        // the server no longer offers resolves to "None" instead of leaving the
        // select holding a value with no matching option. The model is
        // deliberately not resumed this way -- it is the server's to choose.
        const previousCountry = mobileChatHelpers.chooseRestoredCountry(
          countrySelect.value || mobileChatHelpers.readStoredCountry(safeLocalStorage()),
          availableCountries
        );
        if (availableCountries.length > 0) {
          countrySelect.disabled = false;
          countrySelect.innerHTML = '<option value="">None</option>';
          [...availableCountries].sort((a, b) => a.localeCompare(b)).forEach(country => {
            const opt = document.createElement('option');
            opt.value = country;
            opt.textContent = country;
            if (country === previousCountry) opt.selected = true;
            countrySelect.appendChild(opt);
          });
        } else {
          countrySelect.innerHTML = '<option value="">None</option>';
          countrySelect.disabled = true;
        }
      }

      // Every entry is a server character, and the server narrowed them to the
      // chosen country, so the list needs no filtering here.
      const availableVoices = allVoices;

      const newVoicesHash = availableVoices.map(makeCharacterId).join('|') + '|Country:' + countrySelect.value;
      // Selections saved before characters existed look like
      // "source:provider:ShortName", and a browser voice is "browser:Name".
      const knownIds = new Set(allVoices.map(makeCharacterId));
      // The remembered choice outranks what the picker is showing. While the
      // character's own list is still arriving the picker may be showing a
      // fallback, and reading that back would hide the character this browser
      // remembered -- so it would never be restored at all.
      const storedVoice = safeLocalStorage();
      const rememberedVoice = mobileChatHelpers.chooseRememberedVoice(
        storedVoice ? storedVoice.getItem(voiceStorageKey) : '',
        voiceSelect.value,
      );
      const serverVoice = availableVoices.find(v => v.source === 'server') || null;
      const languageLabel = getSelectedLanguageLabel();

      if (lastRenderedVoicesHash === newVoicesHash && voiceSelect.options.length > 1) {
        const preferredVoice = applyPreferredVoice(availableVoices, rememberedVoice, knownIds, serverVoice);
        if (preferredVoice) {
          setStatus(`${mobileChatHelpers.buildCharacterOptionLabel(preferredVoice)} awaits...`);
        }
        return;
      }
      if (!availableVoices.length) {
        // A browser-voice poll may only show its placeholder when there is
        // genuinely nothing else to display. Returning early from the top of
        // this function used to discard characters the server had already
        // returned while browser voices were still being polled.
        let emptyText;
        if (isPollingBrowserVoices) {
          emptyText = getNormalizedDeliveryStyle() === 'spooky' ? 'Summoning the spirits...' : 'Loading voices...';
        } else if (countrySelect.value) {
          emptyText = `No ${languageLabel} characters in ${countrySelect.value}`;
        } else {
          emptyText = 'Select a country to see characters';
        }
        voiceSelect.disabled = true;
        // Rewrite only when the text changed, so a poll tick cannot close an
        // open dropdown. The hash stays empty so the next real render rebuilds
        // rather than taking the shortcut below.
        if (voiceSelect.options.length !== 1 || voiceSelect.options[0].text !== emptyText) {
          voiceSelect.innerHTML = `<option value="">${emptyText}</option>`;
        }
        lastRenderedVoicesHash = '';
        renderCharacterInfo();
        return;
      }

      lastRenderedVoicesHash = newVoicesHash;

      voiceSelect.disabled = false;
      voiceSelect.innerHTML = '';
      availableVoices.forEach((voice) => {
        const option = document.createElement('option');
        option.value = makeCharacterId(voice);
        option.textContent = mobileChatHelpers.buildCharacterOptionLabel(voice);
        voiceSelect.appendChild(option);
      });

      const preferredVoice = applyPreferredVoice(availableVoices, rememberedVoice, knownIds, serverVoice);
      renderCharacterInfo();

      if (preferredVoice) {
        setStatus(`${mobileChatHelpers.buildCharacterOptionLabel(preferredVoice)} awaits...`);
      }
    }

    function applyPreferredVoice(availableVoices, rememberedVoice, knownIds, serverVoice) {
      // The character this browser remembers is restored when the list holds it.
      // A list that does not hold it is not proof the character is gone: it may
      // be another country's list, or the character's own country may still be
      // arriving. So a fallback is shown but never saved over the remembered
      // one -- saving it there is what lost the character between a reload and
      // the list that contained it, and with it the server voice that speaks the
      // reply, since a browser voice cannot stream or be synthesised. Only a
      // choice the list actually holds replaces what was remembered.
      const wanted = mobileChatHelpers.convertLegacyVoiceValue(rememberedVoice, knownIds);
      const matchingVoice = availableVoices.find((voice) => makeCharacterId(voice) === wanted);
      const preferredVoice = matchingVoice || serverVoice || availableVoices[0];
      if (!preferredVoice) {
        return null;
      }
      if (voiceSelect.value !== makeCharacterId(preferredVoice)) {
        voiceSelect.value = makeCharacterId(preferredVoice);
        if (matchingVoice || !rememberedVoice) {
          persistSelectedVoice();
        }
        syncRecognitionLanguage();
      }
      return preferredVoice;
    }

    function populateBrowserVoices() {
      if (!browserTtsEnabled) {
        // Browser voices disabled via TTS_BROWSER_FALLBACK: use server TTS only.
        browserVoices = [];
        renderVoiceOptions();
        return;
      }

      if (!('speechSynthesis' in window)) {
        browserVoices = [];
        renderVoiceOptions();
        return;
      }

      browserVoices = window.speechSynthesis.getVoices()
        .slice()
        .map((voice) => ({
          name: voice.name,
          lang: voice.lang,
          localService: voice.localService,
          source: 'browser'
        }))
        .sort(compareVoices);

      if (!browserVoices.length && voicePollAttempts < 12) {
        voicePollAttempts += 1;
        window.setTimeout(populateBrowserVoices, 500);
      } else {
        voicePollAttempts = 0;
      }

      renderVoiceOptions();
    }

    function normalizeCharacterEntries(characters) {
      // `kind` arrives on the entry from the server, so the client never guesses
      // it. Guessing is how a character could fall through into the voice fold
      // and be collapsed against another character sharing its voice file.
      return (characters || []).map((character) => ({
        ...character,
        lang: character.locale,
        source: 'server'
      })).sort(compareVoices);
    }

    async function loadCountries() {
      try {
        const response = await fetch('/api/countries');
        const payload = await parseJsonResponseStrict(response, 'Country list');
        if (!response.ok || !payload.ok) {
          throw new Error(payload.error || 'Country list failed');
        }
        availableCountries = payload.countries || [];
      } catch (error) {
        availableCountries = [];
        setStatus(`Country list unavailable: ${error.message}`);
      }

      // No country is chosen yet, so there are no characters to show.
      serverCharacters = [];
      renderVoiceOptions();
    }

    async function loadCharactersForCountry(country) {
      const name = String(country || '').trim();
      const token = ++characterRequestToken;

      if (!name) {
        serverCharacters = [];
        renderVoiceOptions();
        return;
      }

      const cached = characterCache.get(name);
      if (mobileChatHelpers.characterCacheEntryIsFresh(cached, Date.now())) {
        serverCharacters = cached.characters;
        renderVoiceOptions();
        return;
      }

      setStatus(`Loading ${name} characters...`);
      try {
        const language = encodeURIComponent(getSelectedLanguage());
        const response = await fetch(`/api/characters?country=${encodeURIComponent(name)}&language=${language}`);
        const payload = await parseJsonResponseStrict(response, 'Character list');
        if (!response.ok || !payload.ok) {
          throw new Error(payload.error || 'Character list request failed');
        }
        characterCache.set(name, {
          characters: normalizeCharacterEntries(payload.characters),
          loadedAt: Date.now()
        });
      } catch (error) {
        // A slower country must not clobber a newer selection.
        if (token === characterRequestToken) {
          serverCharacters = [];
          setStatus(`Character load failed: ${error.message}`);
          renderVoiceOptions();
        }
        return;
      }

      if (token !== characterRequestToken) {
        return;
      }

      const entry = characterCache.get(name);
      serverCharacters = entry.characters;
      renderVoiceOptions();
    }

    async function loadCharacterPicker() {
      await loadCountries();
      await loadCharactersForCountry(countrySelect.value);
    }

    function getSelectedVoice() {
      // An empty value means the placeholder is showing -- no country chosen, so
      // no character is selected. Falling back to the first entry here would
      // speak with a character the picker never offered.
      if (!voiceSelect.value) {
        return null;
      }

      const availableVoices = getAllCharacters();
      const selected = availableVoices.find((voice) => makeCharacterId(voice) === voiceSelect.value) || null;
      if (!selected) {
        return null;
      }

      // Authored characters carry their country in `region`. The country is
      // stamped alongside it so a request the server cannot tie to a character
      // id still says which country it was made under.
      return { ...selected, country: selected.region || countrySelect.value };
    }

    function renderCharacterInfo() {
      // The panel follows the picker: the character the select shows is the one
      // whose facts are shown. A picker holding nothing -- no country chosen yet,
      // or a country still loading -- reads the placeholder, which is what the
      // helper answers for no selection.
      if (!characterInfoButton || !characterInfoPanel) {
        return;
      }

      characterInfoPanel.textContent = mobileChatHelpers.buildCharacterInfoText(getSelectedVoice());
    }

    function setCharacterInfoOpen(open) {
      if (!characterInfoButton || !characterInfoPanel) {
        return;
      }

      // Closed until asked for: the panel is several lines of prose under a
      // picker, and showing it on a hover would flap it over the fields below.
      characterInfoPanel.hidden = !open;
      characterInfoButton.setAttribute('aria-expanded', open ? 'true' : 'false');
      characterInfoButton.classList.toggle('open', open);
    }

    function setStatus(message) {
      // A reply that could not be spoken is the one failure the user cannot see
      // for themselves -- the words look the same on screen either way. The
      // message reporting it used to be replaced within the second, by the
      // microphone re-arming and announcing that it was listening, so the
      // failure left no trace at all. It outranks routine news until the next
      // turn begins.
      if (speechFailure) {
        return;
      }
      statusBox.textContent = message;
    }

    function setSpeechFailure(message) {
      // Deliberately not routed through setStatus: this is the one message that
      // must survive everything that follows it.
      speechFailure = String(message || '').trim() || 'The reply could not be spoken.';
      statusBox.textContent = speechFailure;
    }

    function pickReplyStartMessage() {
      if (!replyStartMessages.length) {
        return { text: 'A presence crosses the veil... it stands among us now.', playFart: false, fartAfterLoop: false };
      }

      // If spooky farts are disabled, avoid selecting messages containing @F
      let pool = replyStartMessages.slice();
      try {
        if (!getSpookyFartsEnabled()) {
          pool = pool.filter(m => !/@F\b/i.test(String(m || '')));
        }
      } catch (e) {
        // ignore and use full pool
      }

      if (!pool.length) pool = replyStartMessages.slice();
      const randomIndex = Math.floor(Math.random() * pool.length);
      const rawMessage = String(pool[randomIndex] || '');
      const trimmedMessage = rawMessage.trim();
      const fartAtStart = /^@F\b/i.test(trimmedMessage);
      const fartAtEnd = /@F\s*$/i.test(trimmedMessage);
      const playFart = /@F\b/i.test(rawMessage);

      // Split around the first @F marker so we can speak parts separately
      const parts = rawMessage.split(/@F\b/i);
      const beforeRaw = (parts[0] || '').replace(/\s{2,}/g, ' ').trim();
      const afterRaw = (parts.length > 1 ? parts.slice(1).join('@F') : '').replace(/\s{2,}/g, ' ').trim();

      let fartPosition = null;
      if (playFart) {
        if (fartAtStart) fartPosition = 'start';
        else if (fartAtEnd) fartPosition = 'end';
        else fartPosition = 'middle';
      }

      const text = `${beforeRaw}${beforeRaw && afterRaw ? ' ' : ''}${afterRaw}`.trim();

      return {
        text: text || 'A presence crosses the veil... it stands among us now.',
        playFart,
        fartAfterLoop: fartAtEnd && !fartAtStart,
        fartPosition,
        beforeText: beforeRaw,
        afterText: afterRaw,
      };
    }

    async function playReplyFart(options = {}) {
      // `waitForEnd` holds the caller until the clip has actually been heard
      // rather than until it has started, which is what lets a spooky preface
      // end on a fart without the reply's voice talking over it.
      const waitForEnd = Boolean(options && options.waitForEnd);
      try {
        const response = await fetch('/api/reply-fart', { cache: 'no-store' });
        if (!response.ok) {
          throw new Error('Reply fart request failed');
        }

        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);
        effectAudio.src = audioUrl;
        effectAudio.volume = 0.3;
        // Apply playback rate from server header if provided
        const rateHeader = response.headers.get('X-Playback-Rate');
        if (rateHeader) {
          const rate = parseFloat(rateHeader);
          if (!Number.isNaN(rate) && rate > 0) {
            effectAudio.playbackRate = rate;
          } else {
            effectAudio.playbackRate = 1.0;
          }
        } else {
          effectAudio.playbackRate = 1.0;
        }
        effectAudio.currentTime = 0;
        // Set before playback starts, so the clip's own end always releases it
        // -- including when a caller waited on that end and would otherwise
        // leave the object URL behind.
        effectAudio.onended = () => {
          URL.revokeObjectURL(audioUrl);
          effectAudio.removeAttribute('src');
          effectAudio.onended = null;
        };
        // Listening starts before playback does, so a clip short enough to end
        // while `play()` is still resolving is not missed.
        const settled = waitForEnd
          ? mobileChatHelpers.waitForMediaEnd(effectAudio, { capMs: 8000 })
          : null;
        await effectAudio.play();
        if (settled) {
          await settled;
        }
      } catch {
        // Ignore missing or unavailable fart clips.
      }
    }

    function cancelActiveReplyStartFartTimer() {
      if (!activeReplyStartFartTimer) {
        return;
      }

      window.clearTimeout(activeReplyStartFartTimer);
      activeReplyStartFartTimer = 0;
    }

    function playActiveReplyStartFartOnce() {
      if (!activeReplyStartFart || activeReplyStartFartPlayed) {
        return;
      }

      if (activeReplyStartFartAfterLoop) {
        cancelActiveReplyStartFartTimer();
        activeReplyStartFartTimer = window.setTimeout(() => {
          activeReplyStartFartTimer = 0;
          if (!isSendingMessage || activeReplyStartFartPlayed || !activeReplyStartFart) {
            return;
          }

          activeReplyStartFartPlayed = true;
          void playReplyFart();
        }, activityMarqueeLoopMs);
        return;
      }

      activeReplyStartFartPlayed = true;
      void playReplyFart();
    }

    function setCurrentCharacter(character) {
      currentCharacter = character && character.name ? character : null;
      updateActivityIndicator();
    }

    function getAssistantName(mode = getDeliveryStyle()) {
      if (currentCharacter && currentCharacter.name) {
        return currentCharacter.name;
      }

      const normalizedStyle = normalizeDeliveryStyle(mode);
      if (normalizedStyle === 'shakespearean') {
        return 'The Entity';
      }

      // Before the first reply arrives, name the character the picker has
      // selected rather than the voice engine behind it. With no country chosen
      // nothing is selected, so fall through to the generic name.
      const selected = getSelectedVoice();
      if (selected) {
        return selected.character_name || getVoiceSpeakerName(selected);
      }

      return 'The Entity';
    }

    function updateActivityIndicator() {
      // Intentionally no-op: status messaging is shown only in the hero status box.
    }

    function formatWebUsage(webTools) {
      const tools = Array.isArray(webTools) ? webTools : [];
      if (tools.includes('search_web') && tools.includes('fetch_webpage')) {
        return 'Web search + page fetch';
      }
      if (tools.includes('fetch_webpage')) {
        return 'Page fetch';
      }
      if (tools.includes('search_web')) {
        return 'Web search';
      }
      return 'Web lookup';
    }

    // The reply as it reaches the screen. The server cleans `reply` before it
    // sends it and keeps the delivery markup beside it for the voice, so this
    // covers the raw strings that travel with it: the streamed sentences, the
    // reply's separate beats, and the markup form itself. It is deliberately not
    // applied to everything a bubble can hold -- a user's own words are theirs,
    // and an error bubble is the interface talking, so neither is markup to be
    // unwrapped.
    function displayReplyText(text) {
      return mobileChatHelpers.normalizeReplyMarkup(text, toneSpeechSettings);
    }

    function addBubble(kind, text, mode = getDeliveryStyle(), metadata = {}) {
      const bubble = document.createElement('div');
      // `proactive` marks a bubble the entity started, so it can be shown as
      // one: a reply that arrives with no question in front of it reads as a
      // glitch unless the interface says otherwise.
      bubble.className = metadata.proactive ? `bubble ${kind} proactive` : `bubble ${kind}`;
      const labelRow = document.createElement('div');
      labelRow.className = 'label-row';
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = kind === 'user' ? 'You' : getAssistantName(mode);
      labelRow.appendChild(label);

      if (kind === 'bot' && metadata.proactive) {
        const tag = document.createElement('span');
        tag.className = 'reply-tag';
        tag.textContent = 'spoke up';
        labelRow.appendChild(tag);
      }

      if (kind === 'bot' && metadata.webUsed) {
        const tag = document.createElement('span');
        tag.className = 'reply-tag';
        tag.textContent = formatWebUsage(metadata.webTools);
        labelRow.appendChild(tag);
      }

      const body = document.createElement('div');
      body.textContent = String(text || '');
      bubble.appendChild(labelRow);
      bubble.appendChild(body);
      conversation.prepend(bubble);

      if (kind === 'bot' && text) {
        lastAssistantReply = text;
        lastAssistantReplyMode = mode;
        repeatButton.disabled = false;
      }

      // Handed back so a streamed reply can grow its bubble as sentences arrive.
      return body;
    }

    function configureAudioPlayback(audioElement, rate = 1) {
      audioElement.playbackRate = rate;
      audioElement.defaultPlaybackRate = rate;
      if ('preservesPitch' in audioElement) audioElement.preservesPitch = true;
      if ('mozPreservesPitch' in audioElement) audioElement.mozPreservesPitch = true;
      if ('webkitPreservesPitch' in audioElement) audioElement.webkitPreservesPitch = true;
    }

    function stopAudioPlayback() {
      if (speechQueue) {
        // Stops the worker loop and aborts any in-flight synthesis fetches
        // through the shared request controller.
        speechQueue.clear();
        speechQueue = null;
      }
      if (prefaceQueue) {
        // Once the reply has claimed `speechQueue` the preface's own queue is
        // no longer reachable through it, and a preface parked on a synthesis
        // fetch rather than on playback has nothing pauseable -- clearing it
        // is the only thing that stops it. Clearing twice when the two are the
        // same queue is harmless.
        prefaceQueue.clear();
        prefaceQueue = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      activeUtterance = null;

      serverAudio.pause();
      // The pause above rejects the in-flight play as an abort, which tears the
      // probe down too -- but only when the element was actually playing. This
      // covers the case where it was not, so the sampler never keeps hold of an
      // element whose source has just been taken away.
      stopSpeechProbe();
      configureAudioPlayback(serverAudio, 1);
      if (currentAudioUrl) {
        URL.revokeObjectURL(currentAudioUrl);
        currentAudioUrl = '';
      }
      serverAudio.removeAttribute('src');
    }

    function interruptProcessing() {
      // If currently listening, stop recognition so we fully exit listening mode
      try { stopRecording(); } catch (e) {}

      if (activeRequestController) {
        activeRequestController.abort();
        activeRequestController = null;
      }
      stopAudioPlayback();
      // The user asked for silence, so anything the entity was holding is not
      // wanted either. Acked, so it does not return on the next reconnect.
      dropDeferredProactive();
      streamedSpeech = null;
      speakingReply = false;
      resetUiState();
      setStatus('Interrupted.');
    }

    function seekMediaTo(media, seconds) {
      // Moves the element to a position, waiting for the clip's length when it
      // has not arrived yet -- a fresh source of unknown duration refuses the
      // position, and the clip's opening would play instead of the resume.
      //
      // A seek that cannot be made is given up on rather than waited on. The
      // wait is bounded because the queue is parked on this promise: resuming
      // from the wrong word is worth less than resuming, but it is worth more
      // than a turn that never speaks again.
      return new Promise((resolve) => {
        const target = Math.max(0, Number(seconds) || 0);
        let settled = false;
        let timer = null;

        function apply() {
          if (settled) {
            return;
          }
          settled = true;
          if (timer) clearTimeout(timer);
          media.removeEventListener('loadedmetadata', apply);
          try {
            media.currentTime = target;
          } catch (error) {
            // An unseekable stream refuses the position. Playing on from where
            // the element stands is the best that is left.
          }
          resolve();
        }

        if (media.readyState >= 1) {
          apply();
          return;
        }
        timer = setTimeout(apply, 2000);
        media.addEventListener('loadedmetadata', apply);
      });
    }

    // The playback probe.
    //
    // It exists for one symptom: a reply that goes quiet part-way through and
    // then carries on, with the missing words never heard and nothing on screen
    // to say why. It records what the audio element was doing while the clip
    // played, and mobileChatHelpers.readPlaybackStall reads a cause out of that
    // record -- or finds none, which is itself the finding.
    //
    // It cannot see an output underrun, because the element API has no event for
    // one. When it reports nothing while the user heard a gap, the loss is below
    // the element: the output device or the audio session, and the next place to
    // look is the Windows audio log, not this page.
    //
    // This is scaffolding for one investigation. It is meant to be deleted once
    // the trigger is known -- the readings are in window.__speechProbe until
    // then.
    const SPEECH_PROBE_EVENT_NAMES = [
      'stalled', 'waiting', 'playing', 'seeking', 'ratechange',
      'volumechange', 'emptied', 'ended', 'error', 'pause',
    ];
    const SPEECH_PROBE_INTERVAL_MS = 250;
    const SPEECH_PROBE_RECORD_LIMIT = 40;
    const speechProbeLog = [];
    let speechProbe = null;
    let speechProbeWatchesDevices = false;

    function watchOutputDevices() {
      // A default output device changing is one of the few things outside this
      // page that can take the audio away, and on wired or built-in speakers it
      // is the remaining candidate. One listener for the life of the page: a
      // change is recorded against whichever clip is playing at the time.
      if (speechProbeWatchesDevices) {
        return;
      }
      speechProbeWatchesDevices = true;
      try {
        if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
          navigator.mediaDevices.addEventListener('devicechange', () => {
            if (speechProbe) {
              speechProbe.events.push({ name: 'devicechange', at: Date.now() });
            }
          });
        }
      } catch (error) {
        // A browser without the API has nothing to record.
      }
    }

    function startSpeechProbe(attempt, resumeFrom) {
      watchOutputDevices();
      const probe = {
        attempt,
        resumeFrom,
        startedAt: Date.now(),
        samples: [],
        events: [],
      };
      probe.onEvent = (event) => {
        probe.events.push({ name: event.type, at: Date.now() });
      };
      SPEECH_PROBE_EVENT_NAMES.forEach((name) => {
        serverAudio.addEventListener(name, probe.onEvent);
      });
      probe.timer = setInterval(() => {
        probe.samples.push(mobileChatHelpers.snapshotPlayback(serverAudio));
      }, SPEECH_PROBE_INTERVAL_MS);
      speechProbe = probe;
    }

    function stopSpeechProbe() {
      // Idempotent, and called from the tear-down as well as from a settled
      // clip, so the sampler never keeps hold of a torn-down element.
      const probe = speechProbe;
      speechProbe = null;
      if (!probe) {
        return null;
      }
      SPEECH_PROBE_EVENT_NAMES.forEach((name) => {
        serverAudio.removeEventListener(name, probe.onEvent);
      });
      clearInterval(probe.timer);
      return probe;
    }

    function finishSpeechProbe(error) {
      // One record per attempt, kept only when the attempt failed. A clip that
      // played is not evidence, and keeping every one of them would bury the
      // interesting record.
      const probe = stopSpeechProbe();
      if (!probe) {
        return;
      }
      if (!error || error.name === 'AbortError') {
        // An abort is the turn being torn down on purpose. Nothing was lost, so
        // there is nothing to explain.
        return;
      }
      probe.error = String(error.message || error.name || 'failed');
      probe.heard = error.heard === true;
      probe.resumable = error.resumable === true;
      probe.stoppedAt = Number(serverAudio.currentTime) || 0;
      probe.verdict = mobileChatHelpers.readPlaybackStall(probe.samples, probe.events);
      speechProbeLog.push(probe);
      while (speechProbeLog.length > SPEECH_PROBE_RECORD_LIMIT) {
        speechProbeLog.shift();
      }
      window.__speechProbe = speechProbeLog;
      console.warn(
        `[speech probe] attempt ${probe.attempt} ${probe.verdict || 'no local cause found'}`
        + ` -- stopped at ${probe.stoppedAt.toFixed(2)}s, ${probe.error}`,
        probe,
      );
    }

    async function playAudioBlob(audioBlob, playbackRate = 1, resumeFrom = null, attempt = 0) {
      // A retry of a clip the browser paused is a resume, not a replay: it
      // carries on instead of repeating the opening the user has already heard.
      //
      // `resumeFrom` is where it carries on from, and it is a moment before the
      // interruption rather than the interruption itself. A pause lands wherever
      // it lands, normally inside a word, so resuming exactly there would begin
      // on that word's tail. The overlap in front of it costs a word said twice
      // and buys the word that would otherwise never be said at all.
      //
      // Where it lands is the helper's answer, and it answers null unless the
      // element still holds this clip part-way through -- the clip it no longer
      // holds is given to it fresh, and seeking a fresh clip to where the last
      // one stopped would start it past its own ending.
      const resumeAt = speechResumeSeekPosition(resumeFrom);
      if (resumeAt === null) {
        currentAudioUrl = URL.createObjectURL(audioBlob);
        serverAudio.src = currentAudioUrl;
      }
      configureAudioPlayback(serverAudio, playbackRate);
      if (resumeAt !== null) {
        await seekMediaTo(serverAudio, resumeAt);
      }
      // Started before play() so a stall inside that call is caught rather than
      // beginning just after it.
      startSpeechProbe(attempt, resumeAt);
      try {
        await serverAudio.play();
      } catch (error) {
        // Playback never began, so none of this clip has been heard: another
        // attempt would be its first, not a repeat of it.
        error.heard = false;
        error.resumable = false;
        finishSpeechProbe(error);
        throw error;
      }

      try {
        await new Promise((resolve, reject) => {
          function cleanup() {
            serverAudio.removeEventListener('ended', handleEnded);
            serverAudio.removeEventListener('error', handleError);
            serverAudio.removeEventListener('pause', handlePause);
            serverAudio.removeEventListener('abort', handleAbort);
          }

          // Only this side can describe what a failed clip leaves behind. `heard`
          // is what the queue weighs before it lets the turn say the whole reply
          // over again, and `resumable` says whether the element still holds the
          // clip part-way through -- which is what a resume needs and what the
          // probe records to tell "the retry worked" from "there was no position
          // to retry from".
          function failed(error) {
            cleanup();
            error.heard = true;
            error.resumable = mobileChatHelpers.canResumeClip(serverAudio, currentAudioUrl);
            reject(error);
          }

          function handleEnded() {
            cleanup();
            resolve();
          }

          function handleError() {
            if (mobileChatHelpers.clipFinished(serverAudio)) {
              // A clip sitting on its last sample has been heard, whatever the
              // element says on the way out -- the same reading handlePause
              // makes, and for the same reason: read as a failure, a clip the
              // user heard to its end is played again.
              cleanup();
              resolve();
              return;
            }
            failed(new Error('Audio playback failed'));
          }

          function handlePause() {
            if (!serverAudio.src || serverAudio.src === '') {
               // Ours: stopAudioPlayback() takes the source out from under the
               // element, and an interrupt is not a failure.
               cleanup();
               reject(new DOMException('Aborted', 'AbortError'));
               return;
            }
            if (mobileChatHelpers.clipFinished(serverAudio)) {
              // The end of a clip arrives as a pause as well as an ended, and the
              // pause comes first -- so a clip heard to its last word stopped here
              // in exactly the way an interrupted clip stops. Read as an
              // interruption it is a clip that failed part-way: a hole reported in
              // a reply that has none, and a resume that winds back into the last
              // words of the clip to say them a second time.
              cleanup();
              resolve();
              return;
            }
            // Someone else paused it part-way through, which is an interruption:
            // part of it did reach the ears, which is what the queue weighs before
            // it lets the turn say the whole reply over again.
            failed(mobileChatHelpers.speechInterruptionError(serverAudio));
          }

          function handleAbort() {
            cleanup();
            reject(new DOMException('Aborted', 'AbortError'));
          }

          serverAudio.addEventListener('ended', handleEnded);
          serverAudio.addEventListener('error', handleError);
          serverAudio.addEventListener('pause', handlePause);
          serverAudio.addEventListener('abort', handleAbort);
        });
        finishSpeechProbe(null);
      } catch (error) {
        finishSpeechProbe(error);
        throw error;
      }
    }

    async function playReplyLaugh(url) {
      const fetchOptions = { cache: 'no-store' };
      if (activeRequestController) {
        fetchOptions.signal = activeRequestController.signal;
      }
      const response = await fetch(url, fetchOptions);
      if (!response.ok) {
        throw new Error('Reply laugh request failed');
      }

      const audioBlob = await response.blob();
      await playAudioBlob(audioBlob);
    }

    // A vocalized sound opens at the pitch its variant gives it and falls
    // across the part of the clip that carries it -- see
    // vocalizationPitchShape in the helpers for the one table of shapes.
    // edge-tts offers one pitch per request and no SSML, so the fall is
    // rendered into the clip itself: Web Audio plays the sound through at a
    // rate that ramps down (which lowers its pitch) and the samples come back
    // as a WAV. The player later stretches the result, and it does so with the
    // pitch preserved, so the fall is still there to hear.
    async function bendVocalizationPitch(audioBlob, variant, pitchStart = null) {
      const AudioContextType = window.AudioContext || window.webkitAudioContext;
      const OfflineContextType = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      if (!audioBlob || !AudioContextType || !OfflineContextType) {
        return audioBlob;
      }
      try {
        const decoding = new AudioContextType();
        let buffer;
        try {
          buffer = await decoding.decodeAudioData(await audioBlob.arrayBuffer());
        } finally {
          if (typeof decoding.close === 'function') {
            decoding.close();
          }
        }
        const span = mobileChatHelpers.voicedSpan(buffer.getChannelData(0), buffer.sampleRate);
        // The segment carries the height its sound opens at, because a series
        // of sounds climbs and only the segment builder saw the series. A
        // segment without one -- an older page, a direct caller -- takes the
        // shape the variant alone gives.
        const shape = mobileChatHelpers.vocalizationPitchShape(variant);
        if (Number.isFinite(pitchStart)) {
          shape.startPitch = pitchStart;
        }
        const plan = mobileChatHelpers.vocalizationPitchPlan(
          buffer.duration,
          span,
          shape.startPitch,
          shape.endPitch,
        );
        const frames = Math.max(1, Math.ceil(plan.sourceEnd * buffer.sampleRate));
        const offline = new OfflineContextType(buffer.numberOfChannels, frames, buffer.sampleRate);
        const source = offline.createBufferSource();
        source.buffer = buffer;
        source.playbackRate.setValueAtTime(plan.pitchStart, 0);
        if (plan.rampEnd > plan.holdUntil) {
          source.playbackRate.setValueAtTime(plan.pitchStart, plan.holdUntil);
          source.playbackRate.linearRampToValueAtTime(plan.pitchEnd, plan.rampEnd);
        }
        source.connect(offline.destination);
        source.start(0);
        const rendered = await offline.startRendering();
        const channels = [];
        for (let index = 0; index < rendered.numberOfChannels; index += 1) {
          channels.push(rendered.getChannelData(index));
        }
        return new Blob(
          [mobileChatHelpers.encodeWav(channels, rendered.sampleRate)],
          { type: 'audio/wav' },
        );
      } catch (error) {
        // The shape is a nicety; an even hum is still the hum.
        return audioBlob;
      }
    }

    async function fetchSpeechAudio(text, voice, mode = getDeliveryStyle(), speechProfile = null, toneName = null, variant = 'base', pitchStart = null) {
      // Synthesis only. Playback is the queue's job so the next segment can be
      // generated while this one is still being heard.
      const profile = speechProfile || resolveSpeechProfile(mode, 'base');
      const fetchOptions = {
        method: 'POST',
        headers: buildJsonHeaders(),
        body: JSON.stringify({
          text: text,
          voice: voice ? voice.name : '',
          provider: voice ? (voice.provider || 'server') : '',
          character_id: mobileChatHelpers.resolveCharacterId(voice),
          rate: profile.rate,
          pitch: profile.depth,
          delivery_style: mode,
          tone: toneName || '',
          preferred_language: getSelectedLanguage()
        })
      };

      if (activeRequestController) {
        fetchOptions.signal = activeRequestController.signal;
      }

      const response = await fetchSpeechAudioWithRetry(fetchOptions);

      if (!response.ok) {
        let payload = {};
        try {
          payload = await parseJsonResponseStrict(response, 'Server speech');
        } catch {
          payload = {};
        }
        throw new Error(payload.error || 'Server speech request failed');
      }

      const audioBlob = mobileChatHelpers.isVocalizationVariant(variant)
        ? await bendVocalizationPitch(await response.blob(), variant, pitchStart)
        : await response.blob();
      const playbackRate = (response.headers.get('X-TTS-Provider') || '').toLowerCase() === 'edge'
        ? profile.rate
        : 1;
      return { blob: audioBlob, playbackRate };
    }

    function speechRequestMayBeRetried(status, attempt) {
      // The single source of truth for "ask for this clip again". A stale
      // helpers asset keeps the rule this page had before -- a server error on
      // the first ask -- which costs the wider retry, never a broken turn.
      if (typeof mobileChatHelpers.shouldRetrySpeechRequest !== 'function') {
        return attempt === 0 && Number(status) >= 500;
      }
      return mobileChatHelpers.shouldRetrySpeechRequest(status, attempt);
    }

    async function fetchSpeechAudioWithRetry(fetchOptions) {
      // The voice service answers 500 when the synthesizer hands back nothing,
      // which is a moment's trouble rather than a bad request, and it is the
      // difference between a reply being heard and a reply being printed with
      // no audio behind it. One more ask covers it -- as it does a connection
      // that never opened, and the two statuses that mean "not now" rather than
      // "no". A request the service refused outright is not worth repeating, and
      // an abort is the user asking for silence.
      for (let attempt = 0; ; attempt += 1) {
        let response = null;
        try {
          response = await fetch('/api/speak', fetchOptions);
        } catch (error) {
          if (error.name === 'AbortError' || !speechRequestMayBeRetried(null, attempt)) {
            throw error;
          }
        }
        if (response && !speechRequestMayBeRetried(response.status, attempt)) {
          return response;
        }
        // Asking again immediately tends to meet the same trouble.
        await waitForAbortableDelay(
          250,
          activeRequestController ? activeRequestController.signal : null,
        );
      }
    }

    function speakWithBrowser(text, voice, mode = getDeliveryStyle(), speechProfile = null) {
      return new Promise((resolve, reject) => {
        if (!('speechSynthesis' in window)) {
          reject(new Error('Browser speech is unavailable'));
          return;
        }

        const profile = speechProfile || resolveSpeechProfile(mode, 'base');

        const utterance = new SpeechSynthesisUtterance(normalizeTextForSpeech(text));
        if (voice && voice.source === 'browser') {
          const browserVoice = window.speechSynthesis.getVoices().find((item) => item.name === voice.name);
          if (browserVoice) {
            utterance.voice = browserVoice;
            utterance.lang = browserVoice.lang;
          }
        }
        utterance.rate = profile.rate;
        utterance.pitch = profile.pitch;
        if (Number.isFinite(profile.volume)) {
          utterance.volume = clampSpeechValue(profile.volume, 0, 1);
        }
        utterance.onend = () => {
          activeUtterance = null;
          resolve();
        };
        utterance.onerror = (e) => {
          activeUtterance = null;
          if (e && (e.error === 'canceled' || e.error === 'interrupted')) {
            reject(new DOMException('Aborted', 'AbortError'));
          } else {
            reject(new Error('Browser speech failed'));
          }
        };
        activeUtterance = utterance;
        window.speechSynthesis.speak(utterance);
      });
    }

    function canStreamSpeech() {
      // Only a server voice can be driven sentence by sentence. A browser voice
      // is spoken through speechSynthesis, which has no queue to grow into, so
      // those replies are spoken whole once the turn finishes.
      const voice = getSelectedVoice();
      return Boolean(speakToggle.checked && voice && voice.source === 'server');
    }

    function takeStreamedSpeech() {
      const session = streamedSpeech;
      streamedSpeech = null;
      return session;
    }

    function ensureStreamedQueue(session) {
      if (session.queue) {
        return session.queue;
      }
      // A spooky preface is the one thing that may already own the speaker. Its
      // promise is taken here, once, and handed to the queue as a gate, so the
      // reply synthesises during the wait and speaks the moment it ends.
      const gate = prefaceSpeech;
      prefaceSpeech = null;
      if (!gate) {
        // The real answer has started arriving, so any filler phrase still
        // playing belongs to the wait that just ended.
        stopAudioPlayback();
      }
      speakingReply = true;
      session.queue = createServerSpeechQueue(session.mode, gate);
      speechQueue = session.queue;
      return session.queue;
    }

    function enqueueStreamedText(session, text) {
      const { segments } = buildSpeechSegments(text);
      if (!segments.length) {
        return;
      }
      ensureStreamedQueue(session);
      segments.forEach((segment) => session.queue.enqueue(segment));
    }

    function handleStreamedSentences(progress) {
      if (!canStreamSpeech()) {
        return;
      }

      const sentences = Array.isArray(progress.sentences) ? progress.sentences : [];
      if (!streamedSpeech) {
        streamedSpeech = {
          queue: null,
          mode: getDeliveryStyle(),
          bubbleBody: null,
          spoken: [],
          consumed: 0,
        };
      }

      const session = streamedSpeech;
      const { texts, consumed } = mobileChatHelpers.readNewSentences(sentences, session.consumed);
      session.consumed = consumed;
      texts.forEach((text) => {
        session.spoken.push(text);
        enqueueStreamedText(session, text);
      });

      // The bubble grows with the voice so the screen and the audio agree.
      const spokenText = displayReplyText(session.spoken.join(' '));
      if (!session.bubbleBody) {
        session.bubbleBody = addBubble('bot', spokenText, session.mode, bubbleMetaFromPayload(progress));
      } else {
        session.bubbleBody.textContent = spokenText;
      }
      setStatus('The Entity is replying...');
    }

    function speechRepairText(report, wholeReply) {
      // What the reply still owes the ears, from the queue's own account of what
      // was heard. The rule itself lives in the helpers; this only covers a
      // cached older copy of app-helpers.js, which keeps no such account.
      if (typeof mobileChatHelpers.speechRecoveryText !== 'function') {
        // Nothing heard at all is the rule this page had before the record
        // existed -- say the reply -- and a gap part way through is left to the
        // status line, which is all it could do then. Never a broken turn, only
        // a coarser one.
        return Number(report && report.played) > 0 ? '' : String(wholeReply || '');
      }
      return mobileChatHelpers.speechRecoveryText(report, wholeReply);
    }

    async function finishStreamedSpeech(session, remainingText) {
      // Nothing was streamed -- the reply was too short, or its layout could
      // not be followed. The caller speaks it whole, exactly as a non-streamed
      // turn would.
      if (!session.queue) {
        return null;
      }

      enqueueStreamedText(session, remainingText);
      const result = await session.queue.drain();
      if (result.firstError) {
        throw result.firstError;
      }
      const partialFailure = mobileChatHelpers.speechPartialFailure(result);
      if (partialFailure) {
        // The reply carried on after the gap, so the turn succeeded with a hole
        // in it -- and the hole is the one thing that has to be said out loud.
        setSpeechFailure(partialFailure);
      }
      // The drain's own account of what was heard, which the caller repairs
      // from: a reply that stopped part way is not a reply gone quiet.
      return result;
    }

    function buildSpeechSegments(text, maxChunkChars = mobileChatHelpers.SPEECH_CHUNK_MAX_CHARS) {
      // One segmentation for every voice path, cut to the limit the caller's
      // transport imposes: a server clip to the TTS cache's own cap, a browser
      // utterance to the longer one it can afford.
      //
      // A segment is a sentence, never a markup run. Cutting at the markup gave
      // every emphasised word a synthesis request of its own, and a request
      // carrying two characters costs the same round trip as one carrying a
      // whole sentence -- so the wait for it was heard as a pause on either side
      // of the word it was meant to stress. The emphasis survives as a beat
      // inside the sentence's own clip; see buildSpokenSentence.
      //
      // Only a sentence too long for one request is cut further, and it is cut
