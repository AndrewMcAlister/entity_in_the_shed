      // at a word boundary. Its pieces are all longer than a word, so the queue
      // can still synthesize them faster than they play.
      //
      // The one other cut is a sound that stands as a clause of its own inside
      // a sentence: it becomes a segment of its own, because that is what lets
      // it be slowed and given its fall instead of being one syllable under the
      // sentence's intonation. See buildSpokenSentenceSegments.
      const spoken = [];
      const segments = [];
      mobileChatHelpers.splitIntoSentences(text).forEach((sentence) => {
        const built = mobileChatHelpers.buildSpokenSentenceSegments(
          sentence,
          toneSpeechSettings,
          normalizeTextForSpeech,
        );
        if (!built.text) {
          return;
        }
        // The sentence as heard is recorded whole; what is spoken may be
        // several clips, because a sound standing as a clause of its own is
        // lifted out to get the length and fall it needs.
        spoken.push(built.text);
        built.segments.forEach((piece) => {
          mobileChatHelpers.splitSpeechIntoChunks(piece.text, maxChunkChars).forEach((chunk) => {
            segments.push({
          text: chunk,
          variant: piece.variant,
          tone: piece.tone,
          pitchStart: piece.pitchStart,
        });
          });
        });
      });
      return { spokenText: spoken.join(' '), segments };
    }

    function createServerSpeechQueue(mode, gate = null) {
      const chosenVoice = getSelectedVoice();
      return mobileChatHelpers.createSpeechQueue({
        lookahead: 2,
        gate,
        synthesize: (segment) => fetchSpeechAudio(
          segment.text,
          chosenVoice,
          mode,
          resolveSpeechProfile(mode, segment.variant),
          segment.tone || null,
          segment.variant,
          segment.pitchStart,
        ),
        play: (audio, segment, attempt) => playAudioBlob(
          audio.blob,
          audio.playbackRate,
          attempt > 0 ? speechResumePosition() : null,
          attempt,
        ),
      });
    }

    function speechResumePosition() {
      // Where the second attempt carries on from: a moment before the point the
      // interruption stopped the clip at. Read at the moment the retry is built,
      // because the element has not moved since it was paused.
      return mobileChatHelpers.resumePosition(
        serverAudio,
        mobileChatHelpers.SPEECH_RESUME_OVERLAP_SECONDS,
      );
    }

    function speechResumeSeekPosition(resumeFrom) {
      // Where a retry seeks to, or null when it must not seek at all. The rule
      // lives in the helpers; this only covers a cached older copy of
      // app-helpers.js, which knows nothing of it -- such a copy still decides a
      // clip can be resumed, so that is asked instead, and the seek it never
      // made is not made here either. Without this the call would throw, and a
      // throw inside the player fails every segment of the reply.
      if (typeof mobileChatHelpers.resumeSeekPosition === 'function') {
        return mobileChatHelpers.resumeSeekPosition(resumeFrom, serverAudio, currentAudioUrl);
      }
      const resumable = resumeFrom !== null
        && mobileChatHelpers.canResumeClip(serverAudio, currentAudioUrl);
      return resumable ? resumeFrom : null;
    }

    function createPrefaceQueue(mode) {
      // One queue for the whole preface, farts included, so the parts are heard
      // in the message's own order and an interrupt has a single handle to cut.
      // It is deliberately not `speechQueue`: the reply claims that slot while
      // the preface is still speaking.
      const chosenVoice = getSelectedVoice();
      return mobileChatHelpers.createSpeechQueue({
        lookahead: 2,
        synthesize: (segment) => (segment.fart
          ? Promise.resolve(null)
          : fetchSpeechAudio(
            segment.text,
            chosenVoice,
            mode,
            resolveSpeechProfile(mode, segment.variant),
            segment.tone || null,
            segment.variant,
            segment.pitchStart,
          )),
        play: async (audio, segment, attempt) => {
          if (segment.fart) {
            // Heard to the end, so the reply's voice starts after the fart
            // rather than over it -- and so a fart before a line does not
            // land on top of the line.
            await playReplyFart({ waitForEnd: true });
            return;
          }
          await playAudioBlob(
            audio.blob,
            audio.playbackRate,
            attempt > 0 ? speechResumePosition() : null,
            attempt,
          );
        },
      });
    }

    function speakPreface(selection) {
      // Speaks the spooky preface and resolves when it has been heard in full.
      // The reply's audio waits on the promise returned here rather than
      // cutting the preface off mid-sentence. It never rejects: the preface is
      // theatre and must not fail the turn.
      const run = async () => {
        const steps = mobileChatHelpers.buildPrefacePlan(selection);
        if (!speakToggle.checked || !steps.length) {
          return;
        }

        const mode = 'spooky';
        const chosenVoice = getSelectedVoice();
        // The one cut, at the start: this is what today's first speak() call
        // did for this turn. It has to happen before the gate can be consumed.
        stopAudioPlayback();
        speakingReply = true;

        let queue = null;

        const speakStepsWithBrowser = async (voice) => {
          for (const step of steps) {
            if (step.type === 'fart') {
              await playReplyFart({ waitForEnd: true });
              continue;
            }
            // buildSpeechSegments has already cut every over-long sentence into
            // chunks a single utterance can carry.
            const playable = buildSpeechSegments(
              step.text,
              BROWSER_SPEECH_CHUNK_CHARS,
            ).segments;
            for (const segment of playable) {
              const baseProfile = resolveSpeechProfile(mode, segment.variant);
              const profile = segment.tone ? applyToneToProfile(baseProfile, segment.tone) : baseProfile;
              await speakWithBrowser(segment.text, voice, mode, profile);
            }
          }
        };

        try {
          if (chosenVoice && chosenVoice.source === 'server') {
            queue = createPrefaceQueue(mode);
            prefaceQueue = queue;
            speechQueue = queue;
            steps.forEach((step) => {
              if (step.type === 'fart') {
                queue.enqueue({ fart: true, text: '' });
                return;
              }
              buildSpeechSegments(step.text).segments.forEach((segment) => queue.enqueue(segment));
            });
            const result = await queue.drain();
            if (result.firstError && browserVoices.length) {
              throw result.firstError;
            }
            return;
          }

          await speakStepsWithBrowser(chosenVoice || browserVoices[0]);
        } catch (error) {
          // An abort is the user tearing the turn down, not a failure to
          // recover from, so the preface stops rather than starting again.
          if (error && error.name === 'AbortError') {
            return;
          }
          // The preface is a nicety: a server voice that failed falls back to
          // the browser one, and anything else is simply dropped.
          if (chosenVoice && chosenVoice.source === 'server' && browserVoices.length) {
            try {
              await speakStepsWithBrowser(browserVoices[0]);
            } catch (innerError) {
              // Give up quietly; the reply is unaffected.
            }
          }
        } finally {
          // Only clear what this preface still holds. `speechQueue` was nulled
          // by the cut above and the reply may have claimed it since; if it
          // holds either the preface's own queue or nothing at all, this
          // preface is still the owner and it is the one that lets go.
          if (prefaceQueue === queue) {
            prefaceQueue = null;
          }
          if (speechQueue === queue || speechQueue === null) {
            speechQueue = null;
            speakingReply = false;
          }
        }
      };

      return run().catch(() => {});
    }

    async function speak(text, mode = getDeliveryStyle(), allowRecovery = true) {
      // `allowRecovery` bounds the repair at one extra pass per turn. The pass
      // that says the words a drain lost is spoken with it off, so a loss inside
      // that pass is reported rather than chased -- otherwise a reply that keeps
      // failing to start would be retried for ever, one attempt at a time.
      if (!speakToggle.checked || !text) {
        return;
      }

      const chosenVoice = getSelectedVoice();
      // Cut to the limit the voice about to speak it imposes: a server clip to
      // the TTS cache's cap, a browser utterance to its own longer one.
      const { spokenText, segments } = buildSpeechSegments(
        text,
        chosenVoice && chosenVoice.source === 'server'
          ? mobileChatHelpers.SPEECH_CHUNK_MAX_CHARS
          : BROWSER_SPEECH_CHUNK_CHARS,
      );
      if (!spokenText) {
        return;
      }
      // This function is for replies that never streamed: a short one, one whose
      // layout could not be followed, the Repeat button, and the repair pass that
      // follows a drain. A streaming reply keeps its own queue
      // (`finishStreamedSpeech`) precisely so that saying the rest of it here
      // cannot cut the sentences the user is mid-way through.
      //
      // A spooky preface owns the speaker until it finishes. By the time the gate
      // settles the preface has already let go of `prefaceQueue`.
      const gate = prefaceSpeech;
      prefaceSpeech = null;
      if (gate) {
        try {
          await gate;
        } catch (error) {
          // A preface that failed is a preface that is over.
        }
      }
      stopAudioPlayback();
      speakingReply = true;

      try {
        if (chosenVoice && chosenVoice.source === 'server') {
          const queue = createServerSpeechQueue(mode);
          speechQueue = queue;
          segments.forEach((segment) => queue.enqueue(segment));
          const result = await queue.drain();
          // Only a failure before any audio played is worth the browser
          // fallback; a gap mid-reply is better than restarting the whole thing.
          if (result.firstError) {
            throw result.firstError;
          }
          const partialFailure = mobileChatHelpers.speechPartialFailure(result);
          if (partialFailure) {
            // Said rather than swallowed: the rest of the reply was heard, so
            // this is not a failure to fall back for, but the user is owed the
            // news that a piece of it went missing.
            setSpeechFailure(partialFailure);
          }
          const missedText = allowRecovery ? speechRepairText(result) : '';
          if (missedText) {
            // Saying the missing words is the repair; the status line above is
            // the record. The queue is finished, so let go of it first -- a
            // repair that stopped itself must not be filed as an interrupt of
            // the reply it is putting right.
            speechQueue = null;
            try {
              await speak(missedText, mode, false);
            } catch (recoveryError) {
              if (recoveryError.name === 'AbortError') {
                throw recoveryError;
              }
              // The repair is the last thing this turn does, so a repair that
              // failed has nothing behind it -- and letting this reach the
              // handler below would say the whole reply again, over the top of
              // the part of it the user has already heard.
              setSpeechFailure(`Voice playback failed: ${recoveryError.message}`);
            }
          }
          return;
        }

        // Already cut into playable chunks by buildSpeechSegments.
        for (const segment of segments) {
          const baseProfile = resolveSpeechProfile(mode, segment.variant);
          const profile = segment.tone ? applyToneToProfile(baseProfile, segment.tone) : baseProfile;
          await speakWithBrowser(segment.text, chosenVoice, mode, profile);
        }
      } catch (error) {
        if (error.name === 'AbortError') {
          throw error;
        }
        if (chosenVoice && chosenVoice.source === 'server' && browserVoices.length) {
          try {
            for (const segment of segments) {
              const baseProfile = resolveSpeechProfile(mode, segment.variant);
              const profile = segment.tone ? applyToneToProfile(baseProfile, segment.tone) : baseProfile;
              await speakWithBrowser(segment.text, browserVoices[0], mode, profile);
            }
            setSpeechFailure(`Server voice failed. Using browser fallback: ${error.message}`);
            return;
          } catch (innerError) {
            if (innerError.name === 'AbortError') {
              throw innerError;
            }
            // ignore and fall through to final status update
          }
        }

        setSpeechFailure(`Voice playback failed: ${error.message}`);
      } finally {
        speakingReply = false;
        speechQueue = null;
        // Hands-free: the reply is done, so the mic can go back on.
        maybeResumeListening();
      }
    }

    function getRecognitionTranscript() {
      return `${finalizedRecognitionTranscript} ${interimRecognitionTranscript}`.trim();
    }

    function normalizeCapturedTranscript(text) {
      return String(text || '').replace(/\s+/g, ' ').trim();
    }

    function collapseTranscriptParts(parts) {
      const collapsedParts = [];

      for (const rawPart of parts) {
        const part = normalizeCapturedTranscript(rawPart);
        if (!part) {
          continue;
        }

        const previousPart = collapsedParts[collapsedParts.length - 1] || '';
        if (!previousPart) {
          collapsedParts.push(part);
          continue;
        }

        if (part === previousPart || part.startsWith(`${previousPart} `)) {
          collapsedParts[collapsedParts.length - 1] = part;
          continue;
        }

        if (previousPart.startsWith(`${part} `)) {
          continue;
        }

        collapsedParts.push(part);
      }

      return collapsedParts;
    }

    function clearRecognitionTranscript(clearMessageInput = false) {
      finalizedRecognitionTranscript = '';
      interimRecognitionTranscript = '';
      lastTranscriptForSilenceTimer = '';
      recognitionCarriedTranscript = '';
      if (clearMessageInput) {
        messageInput.value = '';
        // Emptying the box on dictation's behalf is dictation taking it: there
        // is nothing left in it for the user to own.
        inputOwnedByUser = false;
      }
    }

    function cancelSilenceStopTimer() {
      if (silenceStopTimer) {
        window.clearTimeout(silenceStopTimer);
        silenceStopTimer = 0;
      }
      silenceStopWaitStartedAtMs = 0;
    }

    function cancelRecognitionStallWatchdog() {
      if (recognitionStallWatchdogTimer) {
        window.clearTimeout(recognitionStallWatchdogTimer);
        recognitionStallWatchdogTimer = 0;
      }
    }

    function cancelRecognitionStopFallback() {
      if (recognitionStopFallbackTimer) {
        window.clearTimeout(recognitionStopFallbackTimer);
        recognitionStopFallbackTimer = 0;
      }
    }

    function noteRecognitionActivity() {
      recognitionLastActivityAtMs = Date.now();
    }

    function scheduleRecognitionStallWatchdog() {
      cancelRecognitionStallWatchdog();
      if (!recording || !recognition) {
        return;
      }

      if (!recognitionLastActivityAtMs) {
        noteRecognitionActivity();
      }

      recognitionStallWatchdogTimer = window.setTimeout(() => {
        recognitionStallWatchdogTimer = 0;
        if (!recording || !recognition) {
          return;
        }

        const elapsedMs = Date.now() - recognitionLastActivityAtMs;
        if (elapsedMs < recognitionStallTimeoutMs) {
          scheduleRecognitionStallWatchdog();
          return;
        }

        if (recognitionStallRecoveryAttempts >= recognitionMaxStallRecoveryAttempts) {
          recording = false;
          updateMicButtonState();
          // Stand hands-free down rather than looping on a mic that has stopped
          // responding; one tap brings it back.
          disableHandsFreeForMicrophoneFailure('Listening became unresponsive. Tap to try again.');
          return;
        }

        recognitionStallRecoveryAttempts += 1;
        setStatus('Listening stalled. Restarting microphone...');
        try {
          // Stopping ends the session cleanly and lets onend decide what comes
          // next. It must not start one here as well: an extra start is an
          // extra chime, and a stalled session is not worth one.
          recognition.stop();
        } catch (error) {
          recording = false;
          updateMicButtonState();
          disableHandsFreeForMicrophoneFailure('Listening stalled and could not restart. Tap to try again.');
        }
      }, recognitionStallTimeoutMs + 200);
    }

    function resetUiState() {
      isSendingMessage = false;
      sendButton.disabled = false;
      interruptButton.disabled = true;
      micButton.disabled = false;
      updateMicButtonState();
    }

    function scheduleSilenceStop(keepWaiting = false) {
      // The wait window runs from the first arming, so a pause that keeps
      // waiting because the user is still speaking is still bounded by it.
      const waitStartedAtMs = keepWaiting && silenceStopWaitStartedAtMs
        ? silenceStopWaitStartedAtMs
        : Date.now();
      cancelSilenceStopTimer();
      if (!recording) {
        return;
      }

      silenceStopWaitStartedAtMs = waitStartedAtMs;
      silenceStopTimer = window.setTimeout(() => {
        silenceStopTimer = 0;
        if (!recording) {
          return;
        }

        // Results arrive in bursts, so a transcript that has gone quiet is not
        // the same as a user who has stopped. Speech the engine still reports
        // re-arms the pause instead of ending the turn.
        if (silenceStopShouldKeepWaiting()) {
          scheduleSilenceStop(true);
          return;
        }

        pendingSilenceAutoSendTranscript = normalizeCapturedTranscript(getRecognitionTranscript());
        stopRecording('pause');
      }, silenceStopDelayMs);
    }

    function updateMicButtonState() {
      const showListeningState = recording;
      micButton.classList.toggle('recording', showListeningState);
      micButton.textContent = showListeningState ? 'Listening... tap to stop' : 'Tap To Speak';
      updateActivityIndicator();
    }

    async function playReplyAudio(text, mode, replyLaughUrl, baseStatus) {
      try {
        await speak(text, mode);
        if (replyLaughUrl) {
          await playReplyLaugh(replyLaughUrl);
        }
      } catch (error) {
        if (error.name === 'AbortError') {
          return;
        }
        setStatus(`${baseStatus} Voice playback failed: ${error.message}`);
      }
    }

    function waitForAbortableDelay(delayMs, signal) {
      return new Promise((resolve, reject) => {
        const timer = window.setTimeout(() => {
          cleanup();
          resolve();
        }, delayMs);

        function cleanup() {
          window.clearTimeout(timer);
          if (signal) {
            signal.removeEventListener('abort', handleAbort);
          }
        }

        function handleAbort() {
          cleanup();
          reject(new DOMException('Aborted', 'AbortError'));
        }

        if (signal) {
          if (signal.aborted) {
            cleanup();
            reject(new DOMException('Aborted', 'AbortError'));
            return;
          }

          signal.addEventListener('abort', handleAbort, { once: true });
        }
      });
    }

    function bubbleMetaFromPayload(payload) {
      // What a bubble needs to say about the turn that produced it. Read from
      // whichever payload is to hand: a mid-turn poll carries no web usage, and
      // the closing payload does -- and the closing payload can be the first one
      // to carry a sentence, in which case it is also the one creating the
      // bubble.
      return {
        webUsed: Boolean(payload && payload.web_used),
        webTools: (payload && payload.web_tools) || [],
      };
    }

    function handleChatJobProgress(progress) {
      // The job publishes the style its turn resolved as soon as it knows it,
      // because streamed sentences are voiced in whatever style the page is
      // showing. Adopting it here means a reloaded page continues the
      // conversation's voice from the first spoken sentence, not from the
      // closing payload.
      if (progress && progress.delivery_style) {
        applyDeliveryStyle(progress.delivery_style);
      }
      // Only real reply sentences are ever spoken. The entity used to announce
      // a canned phrase ("Let me think about that for a moment.") before every
      // answer; it read as filler, so now it simply waits and answers.
      const sentences = (progress && progress.sentences) || [];
      if (Array.isArray(sentences) && sentences.length) {
        handleStreamedSentences(progress);
      }
    }

    async function waitForChatJob(jobId, onProgress = null) {
      const normalizedJobId = String(jobId || '').trim();
      if (!normalizedJobId) {
        throw new Error('Chat job id was missing.');
      }

      while (true) {
        const pollResponse = await fetch(`/api/chat/jobs/${encodeURIComponent(normalizedJobId)}`, {
          headers: buildJsonHeaders(),
          cache: 'no-store',
          signal: activeRequestController ? activeRequestController.signal : undefined,
        });
        const pollPayload = await parseJsonResponseStrict(pollResponse, 'Chat job');

        if (!pollResponse.ok || !pollPayload.ok) {
          throw new Error(pollPayload.error || 'Request failed');
        }

        // The hand-off happens before the pending check, so the payload that
        // ends the turn goes through it too. A reply's closing sentence is
        // published as the turn finishes -- after the last pending poll that
        // could have carried it -- so the finished payload is the only place it
        // can still arrive from, and skipping it here loses that sentence.
        if (typeof onProgress === 'function') {
          // Progress is best-effort: a filler phrase or a streamed sentence
          // must never be able to fail the turn.
          try {
            onProgress(pollPayload);
          } catch (error) {
            // ignore
          }
        }

        if (!pollPayload.pending) {
          return pollPayload;
        }

        // Only a pending job has a status worth showing; the finished payload's
        // status is the reply's own line, set by the caller.
        setStatus(pollPayload.status || 'The Entity is thinking...');

        await waitForAbortableDelay(
          chatJobPollIntervalMs,
          activeRequestController ? activeRequestController.signal : null,
        );
      }
    }

    // ---------------------------------------------------------------------
    // Unprompted delivery
    //
    // The entity can speak when no turn is in flight, which means nothing the
    // client does causes the message to arrive -- it has to be pushed. Two
    // paths carry it and only one runs at a time: the event stream, and a poll
    // that covers a stream which is not up. Both read from the same durable
    // queue on the server, so a message survives a closed tab either way.
    // ---------------------------------------------------------------------

    function proactiveVoiceContext() {
      // One snapshot of everything the delivery decision reads, so the plan is
      // made from consistent values rather than re-reading globals between
      // checks.
      return {
        enabled: proactiveEnabled,
        sending: isSendingMessage,
        speaking: speakingReply,
        recording,
        handsFree: isHandsFreeEnabled(),
        hearingSpeech: recognitionHearingSpeech,
      };
    }

    function renderProactiveMessage(message) {
      const deliveryId = String((message && message.deliveryId) || '');
      if (!mobileChatHelpers.shouldDeliverProactive({
        enabled: proactiveEnabled,
        deliveryId,
        text: String((message && message.text) || ''),
        seenDeliveryIds,
      })) {
        return false;
      }

      // Accepted now, even if it is about to be held: this is what stops the
      // SSE frame and a poll of the same line from each queueing a copy.
      seenDeliveryIds.add(deliveryId);

      // A character the server named overrides the picker for this bubble only;
      // the turn path does the same via setCurrentCharacter.
      const mode = message.deliveryStyle || getNormalizedDeliveryStyle();

      // A reply that is being generated or read out owns the speaker. Calling
      // speak() stops whatever is playing, so a line arriving now would cut the
      // reply the user actually asked for -- and showing it early would tag it
      // "spoke up" while it is still silent, above a bubble that is still being
      // written in place. Hold the whole delivery until the reply has let go.
      // The typeof check is a cached older app-helpers.js: without the helper
      // the page keeps the old show-at-once behaviour rather than throwing.
      const canHold = speakToggle.checked
        && typeof mobileChatHelpers.shouldHoldProactive === 'function';
      if (canHold && mobileChatHelpers.shouldHoldProactive(proactiveVoiceContext())) {
        deferredProactive.push({ message, mode });
        return true;
      }

      return deliverProactiveMessage(message, mode);
    }

    function deliverProactiveMessage(message, mode) {
      const deliveryId = String((message && message.deliveryId) || '');
      // Not advanced when the line was held: this is the reconnect floor for
      // delivered lines, and an unacknowledged held line may legitimately be
      // replayed -- the seen-set is what absorbs that.
      const seq = Number(message.seq) || 0;
      if (seq > lastDeliveredSeq) {
        lastDeliveredSeq = seq;
      }

      addBubble('bot', displayReplyText(message.text), mode, {
        proactive: true,
        deliveryId,
        trigger: message.trigger,
      });
      acknowledgeOutboundMessage(deliveryId);

      setStatus(`${getAssistantName(mode)} spoke up.`);

      // Said out loud, unlike before -- but only when nothing else is being
      // said, no turn is in flight and the microphone is not hearing a person.
      // A hands-free session is listening between turns, which is not the same
      // as somebody talking: that microphone is set down, the line is spoken,
      // and it is picked back up afterwards, because a line said into a live
      // microphone is a line the recognizer dictates back as the user's turn.
      // Nothing is said when replies are not spoken at all, so there is no
      // voice to make room for: setting the microphone down for a line that
      // will never be heard would only make it churn.
      if (speakToggle.checked && mobileChatHelpers.shouldVoiceProactive(proactiveVoiceContext())) {
        // Reused rather than re-implemented, so a random line that fails to
        // play is reported exactly as a reply that fails to play. The markup
        // form is what it says, so the line keeps its delivery; `text` is what
        // the bubble above was built from.
        void speakProactiveMessage(message, mode, `${getAssistantName(mode)} spoke up.`);
      }
      return true;
    }

    function drainDeferredProactive() {
      // Called only where an outermost flow has just released the speaker: a
      // finished turn, a finished unprompted line, a finished repeat. The guard
      // keeps the loop from nesting inside itself, because delivering a line
      // that is voiced synchronously claims the speaker again and the wrapper's
      // own finally is what starts the next one.
      if (drainingDeferredProactive) {
        return;
      }
      if (!proactiveEnabled) {
        dropDeferredProactive();
        return;
      }
      drainingDeferredProactive = true;
      try {
        while (deferredProactive.length && !isSendingMessage && !speakingReply) {
          const next = deferredProactive.shift();
          deliverProactiveMessage(next.message, next.mode);
        }
      } finally {
        drainingDeferredProactive = false;
      }
    }

    function dropDeferredProactive() {
      // The user asked for silence (an interrupt) or switched the chatterbox
      // off, so what was waiting is not wanted. Acked anyway: an unacknowledged
      // line is redelivered on the next reconnect, and "I cancelled it" must
      // not mean "it comes back in a minute".
      const dropped = deferredProactive;
      deferredProactive = [];
      dropped.forEach((entry) => {
        const id = String((entry.message && entry.message.deliveryId) || '');
        if (id) {
          acknowledgeOutboundMessage(id);
        }
      });
    }

    async function speakProactiveMessage(message, mode, status) {
      // `speakingReply` is held from the first moment: it is what keeps the
      // recognition engine's own end event from re-arming the microphone
      // during the hand-over. speak() releases it and hands the microphone
      // back when the line finishes.
      speakingReply = true;
      try {
        if (recording) {
          await stopRecording();
        }
        await playReplyAudio(message.textMarkup, mode, null, status);
      } catch (error) {
        // The microphone refused to let go. The bubble is already on screen;
        // starting a voice into a live microphone would only dictate it.
      } finally {
        speakingReply = false;
        // Anything held while this line played follows it. This is also the
        // path that covers a stopRecording() failure, where speak() never ran.
        drainDeferredProactive();
        maybeResumeListening();
      }
    }

    function acknowledgeOutboundMessage(deliveryId) {
      // Best-effort. Delivery stays at-least-once until the server records the
      // ack, so a failed ack costs a re-delivery on the next reconnect, which
      // the seen-set above absorbs -- never a lost message.
      fetch(`/api/entity/outbox/${encodeURIComponent(deliveryId)}/ack`, {
        method: 'POST',
        headers: buildJsonHeaders(),
        body: JSON.stringify({ client_id: clientId }),
      }).catch(() => {});
    }

    async function pollOutbox() {
      if (!mobileChatHelpers.shouldPollOutbox({
        enabled: proactiveEnabled,
        streamConnected: Boolean(entityStream),
        sending: isSendingMessage,
        hidden: document.visibilityState === 'hidden',
      })) {
        scheduleOutboxPoll();
        return;
      }

      try {
        const response = await fetch(
          mobileChatHelpers.buildOutboxRequestUrl(clientId),
          { headers: buildJsonHeaders(), cache: 'no-store' },
        );
        const payload = await response.json();
        adoptClientIdentity(payload);
        mobileChatHelpers.readOutboxMessages(payload)
          .forEach((message) => renderProactiveMessage(message));
        outboxPollAttempts = 0;
      } catch (error) {
        // A failed poll is expected while the server restarts; the backoff below
        // is what keeps it from becoming a loop.
        outboxPollAttempts += 1;
      }
      scheduleOutboxPoll();
    }

    function scheduleOutboxPoll() {
      window.clearTimeout(outboxPollTimer);
      if (!proactiveEnabled) {
        return;
      }
      const delay = mobileChatHelpers.nextOutboxPollDelayMs(outboxPollAttempts, outboxPollMs);
      outboxPollTimer = window.setTimeout(pollOutbox, delay);
    }

    function stopEntityStream() {
      if (entityStream) {
        try { entityStream.close(); } catch (error) {}
        entityStream = null;
      }
    }

    function startEntityStream() {
      // The stream is the fast path; the poll is the fallback, so a browser with
      // no EventSource loses latency rather than the feature.
      if (!proactiveEnabled || typeof window.EventSource !== 'function') {
        return;
      }

      stopEntityStream();
      const url = mobileChatHelpers.buildEntityStreamUrl(clientId, lastDeliveredSeq);
      const source = new EventSource(url);
      entityStream = source;

      source.addEventListener('utterance', (event) => {
        try {
          const messages = mobileChatHelpers.readOutboxMessages(JSON.parse(event.data));
          if (messages.length) {
            renderProactiveMessage(messages[0]);
          }
        } catch (error) {
          // A malformed frame must not kill the stream; the poll still covers us.
        }
      });

      source.addEventListener('error', () => {
        // EventSource reconnects on its own, but it also reports a server-side
        // refusal this way (a full registry, or the reconnect floor), so the
        // poll is armed rather than waiting for a reconnect that may not come.
        scheduleOutboxPoll();
      });
    }

    function refreshProactiveDelivery() {
      if (!proactiveEnabled) {
        stopEntityStream();
        window.clearTimeout(outboxPollTimer);
        return;
      }
      startEntityStream();
      scheduleOutboxPoll();
    }

    async function bootstrapProactiveDelivery() {
      // Without this the client learns whether the entity may speak only from a
      // chat response, so the entity could not open its mouth until the user had
      // already spoken -- reintroducing at the client layer the exact reactivity
      // the whole design exists to remove. The state endpoint answers the same
      // question at load, with no turn, no model and no lock.
      try {
        const response = await fetch(
          mobileChatHelpers.buildEntityStateUrl(clientId),
          { headers: buildJsonHeaders(), cache: 'no-store' },
        );
        if (!response.ok) {
          return;
        }
        adoptClientIdentity(await response.json());
      } catch (error) {
        // Not an error state: the first turn still switches delivery on, so a
        // failed probe degrades to the previous behaviour rather than breaking.
        return;
      }
      refreshProactiveDelivery();
    }

    document.addEventListener('visibilitychange', () => {
      // A hidden tab stops polling, so returning to it has to restart delivery
      // rather than wait out a backoff that was set while nobody was looking.
      if (document.visibilityState === 'visible') {
        refreshProactiveDelivery();
      }
    });

    async function sendMessage(messageOverride, options) {
      if (isSendingMessage) {
        return;
      }

      const voiceMode = Boolean(options && options.voiceMode);
      let payloadText = typeof messageOverride === 'string' ? messageOverride : '';
      const message = String(payloadText || messageInput.value).trim();
      if (!message) {
        setStatus('Enter or dictate a message first.');
        return;
      }

      isSendingMessage = true;
      // A turn is under way, so any earlier "user stopped listening" no longer
      // applies -- hands-free should pick the mic back up when the reply ends.
      userStoppedListening = false;
      // Any streamed reply still being spoken belongs to the previous turn.
      streamedSpeech = null;
      // And the previous turn's trouble with it is no longer the news.
      speechFailure = '';
      resetSpookyState();
      const chosenVoice = getSelectedVoice();
      addBubble('user', message);
      if (getNormalizedDeliveryStyle() === 'spooky') {
        const selectedReplyStart = pickReplyStartMessage();
        addBubble('bot', selectedReplyStart.text, 'spooky');
        // Not awaited: the preface is spoken while the turn runs on the server.
        // The promise is kept in `prefaceSpeech` so the reply's voice can wait
        // for it rather than cut it off.
        prefaceSpeech = speakPreface(selectedReplyStart);
      }
      updateActivityIndicator();
      setStatus(`The Entity is thinking...`);
      sendButton.disabled = true;
      micButton.disabled = true;
      interruptButton.disabled = false;
      updateMicButtonState();
      clearRecognitionTranscript();
      if (messageInput.value.trim() === message) {
        messageInput.value = '';
        // The turn took the box's text with it, so the microphone may have it
        // back -- unless the user has started typing again, which is precisely
        // what the test above tells apart.
        inputOwnedByUser = false;
      }
      if (recording) {
        stopRecording();
      }

      let chatRequestTimeoutTimer = 0;
      let chatRequestTimedOut = false;

      try {
        // Ensure models are loaded before sending the message
        try {
          if (!Array.isArray(modelLists.full) || !modelLists.full.length || modelSelect.disabled) {
            setStatus('Loading models...');
            await loadAvailableModels();
            setStatus('Models loaded.');
          }
        } catch (e) {
          // non-fatal: proceed and let server handle missing model
          console.warn('Model load attempt failed:', e);
        }

        activeRequestController = new AbortController();
        const fetchPromise = fetch('/api/chat', {
          method: 'POST',
          headers: buildJsonHeaders(),
          signal: activeRequestController.signal,
          body: JSON.stringify(mobileChatHelpers.buildChatRequestPayload({
            message,
            mcpAccessToken,
            deferred: true,
            deliveryStyle: deliveryStyleChosen ? getNormalizedDeliveryStyle() : '',
            modelName: modelSelect ? modelSelect.value : '',
            preferredLanguage: getSelectedLanguage(),
            textReportFormat: getTextReportFormatEnabled(),
            voiceMode,
            clientId,
            selectedVoice: chosenVoice
          }))
        });

        const timeoutEnabled = Number.isFinite(chatRequestTimeoutMs) && chatRequestTimeoutMs > 0;
        let response;

        if (timeoutEnabled) {
          const timeoutPromise = new Promise((_, reject) => {
            chatRequestTimeoutTimer = window.setTimeout(() => {
              chatRequestTimedOut = true;
              try {
                if (activeRequestController) {
                  activeRequestController.abort();
                }
              } catch (abortError) {
                // ignore controller abort failures
              }
              reject(new Error('timeout'));
            }, chatRequestTimeoutMs);
          });

          response = await Promise.race([fetchPromise, timeoutPromise]);
          window.clearTimeout(chatRequestTimeoutTimer);
        } else {
          response = await fetchPromise;
        }

        let payload = await parseJsonResponseStrict(response, 'Chat API');

        if (payload.pending && payload.job_id) {
          payload = await waitForChatJob(payload.job_id, handleChatJobProgress);
        }

        // Every turn is authoritative about identity and about whether the
        // entity may speak unprompted, so this is where delivery gets switched
        // on -- the response is the first thing that knows.
        adoptClientIdentity(payload);
        refreshProactiveDelivery();

        if (!response.ok || !payload.ok) {
          throw new Error(payload.error || 'Request failed');
        }

        setCurrentCharacter(payload.character || null);

        // The server resolved the style -- from this turn's explicit choice, the
        // conversation's last one, or the person's wider habit -- so the page
        // takes its answer. That is what lets a reload or another device
        // continue the conversation in the same voice. It does not mark the
        // style as chosen: the next turn still asks the server to continue it.
        if (payload.delivery_style) {
          applyDeliveryStyle(payload.delivery_style);
        }

        const returnedDeliveryStyle = payload.delivery_style || getDeliveryStyle();
        const fullReply = String(payload.reply || '');
        // The same reply as the voice receives it. The server cleans `reply` and
        // keeps the raw text in `reply_markup`, because the emphasis wrappers it
        // removes are what make the voice lift and quicken a phrase. Speech takes
        // this one; the screen takes `fullReply`. A server older than the field
        // sends none, and then the cleaned reply is what there is to say -- a
        // lost emphasis rather than a spoken bracket, which is the way this pair
        // is meant to fail.
        const fullReplyMarkup = String(payload.reply_markup || payload.reply || '');
        const session = takeStreamedSpeech();

        // `streamed_remaining` is the part of the reply the server knows the
        // client has not spoken yet. It falls back to the whole reply when the
        // server had nothing to stream. Both it and what was spoken are markup
        // text -- the queue speaks the markup -- so the remainder is compared
        // against markup too, or a reply that was spoken in full would look
        // unspoken wherever a wrapper made the two strings differ.
        let remainingText = fullReplyMarkup;
        if (session) {
          remainingText = typeof payload.streamed_remaining === 'string'
            ? payload.streamed_remaining
            : fullReplyMarkup;
          // The server counts a sentence as spoken the moment it publishes it,
          // and the reply's last one is published as the turn ends -- after the
          // final poll that could have carried it here. So the server can say
          // nothing is left to speak while a sentence the page never received
          // has never been heard. What this page enqueued is the only account
          // that cannot be wrong, so the longer of the two is the one to say.
          // Guarded like the helper calls below: a page holding a helper one
          // version behind must lose this, never its reply.
          const localRemainder = typeof mobileChatHelpers.splitReplyAfterStream === 'function'
            ? mobileChatHelpers.splitReplyAfterStream(fullReplyMarkup, session.spoken.join(' '))
            : null;
          if (localRemainder && !localRemainder.replaced
            && localRemainder.remaining.length > remainingText.length) {
            remainingText = localRemainder.remaining;
          }
          if (payload.stream_replaced) {
            // The reply was rewritten after it started being spoken, so what
            // the user heard does not match the transcript. Say the whole thing
            // again rather than leaving the two disagreeing.
            remainingText = fullReplyMarkup;
          }
        }

        const bubbleMeta = bubbleMetaFromPayload(payload);

        // A turn that produced genuinely separate beats becomes genuinely
        // separate bubbles, so the screen matches what was said rather than one
        // long block. A tool turn is excluded: its preface is already a bubble
        // of its own, and the beats belong to the answer that followed it, so
        // splitting there would put the preface and the answer in conversation
        // with each other.
        // The helpers are a separate asset that something between here and the
        // server may be holding an older copy of. A helper one version behind
        // must cost the user only the feature it lacks -- never the reply -- so
        // it is called through a check, and its absence means one bubble, which
        // is what this page did before segments existed.
        const replySegments = typeof mobileChatHelpers.readNewSegments === 'function'
          ? mobileChatHelpers.readNewSegments(payload.reply_segments, 0).texts
          : [];
        if (replySegments.length && !payload.tools_used && !payload.stream_replaced) {
          if (session && session.bubbleBody) {
            // The bubble already holds the sentences streamed so far, which are
            // the opening beats. Rewrite it as the first segment and add the
            // rest, so nothing is said twice.
            session.bubbleBody.textContent = displayReplyText(replySegments[0]);
            replySegments.slice(1).forEach((text) => {
              addBubble('bot', displayReplyText(text), returnedDeliveryStyle, bubbleMeta);
            });
          } else {
            replySegments.forEach((text) => {
              addBubble('bot', displayReplyText(text), returnedDeliveryStyle, bubbleMeta);
            });
          }
          lastAssistantReplyMode = returnedDeliveryStyle;
          repeatButton.disabled = false;
        } else if (!session || !session.bubbleBody) {
          addBubble('bot', displayReplyText(fullReply), returnedDeliveryStyle, bubbleMeta);
        } else if (payload.tools_used || payload.stream_replaced) {
          // The preface was already shown and spoken; the answer that followed
          // the tool call is a second thing the user hears.
          addBubble('bot', displayReplyText(payload.stream_replaced ? fullReplyMarkup : remainingText), returnedDeliveryStyle, bubbleMeta);
        } else {
          session.bubbleBody.textContent = displayReplyText(fullReply);
          lastAssistantReplyMode = returnedDeliveryStyle;
          repeatButton.disabled = false;
        }

        // Every branch above showed the reply; Repeat means the whole of it, and
        // the markup form is the one to say. The branches that added a bubble
        // each claimed this in turn -- with the beat they were showing, which is
        // not the whole answer -- so it is set once here, after them.
        if (fullReplyMarkup) {
          lastAssistantReply = fullReplyMarkup;
        }

        const webSuffix = payload.web_used ? ` using ${formatWebUsage(payload.web_tools || []).toLowerCase()}.` : '.';
        const characterLabel = payload.character && payload.character.name ? `${payload.character.name} replied` : 'Reply received';
        const modelSuffix = payload.model ? ` from ${formatModelName(payload.model)}` : '';
        const replyStatus = `${characterLabel}${modelSuffix} in ${formatDeliveryStyle(returnedDeliveryStyle)} mode${webSuffix}`;
        setStatus(replyStatus);
        // Respect spooky laughs toggle when in spooky mode
        const laughUrl = (normalizeDeliveryStyle(returnedDeliveryStyle) === 'spooky' && !getSpookyLaughsEnabled()) ? null : payload.reply_laugh_url;

        if (session) {
          let speechReport = null;
          try {
            speechReport = await finishStreamedSpeech(session, remainingText);
          } catch (error) {
            if (error.name === 'AbortError') {
              throw error;
            }
            // Nothing played, so the reply can still be said properly through
            // the normal path, browser fallback and all.
          } finally {
            speakingReply = false;
            speechQueue = null;
            maybeResumeListening();
          }
          if (speechReport) {
            // The words that never arrived, said now, once. Nothing heard at all
            // leaves the whole reply to say; a hole part way through leaves only
            // the hole; a user's interrupt leaves nothing, because they asked
            // for the quiet. And this pass is not itself repairable, so a second
            // stop ends the turn rather than starting a third attempt.
            const missedText = speechRepairText(speechReport, fullReplyMarkup);
            if (missedText) {
              await speak(missedText, returnedDeliveryStyle, false);
            }
          } else {
            await speak(fullReplyMarkup, returnedDeliveryStyle);
          }
          if (laughUrl) {
            await playReplyLaugh(laughUrl);
          }
          return;
        }

        await playReplyAudio(remainingText, returnedDeliveryStyle, laughUrl, replyStatus);
      } catch (error) {
        if (error.name === 'AbortError') {
          if (!chatRequestTimedOut) {
            return;
          }
          const timeoutError = summarizeChatRequestError(new Error('timeout'));
          if (!messageInput.value.trim() && !recording) {
            messageInput.value = message;
            // Giving the user their words back is giving them the box: hands-free
            // would otherwise let the next transcript write over them.
            takeMessageBoxFromMicrophone();
          }
          addBubble('bot', timeoutError.bubble);
          setStatus(timeoutError.status);
          return;
        }
        const userError = summarizeChatRequestError(error);
        if (!messageInput.value.trim() && !recording) {
          messageInput.value = message;
          // As above: the box holds the user's words again.
          takeMessageBoxFromMicrophone();
        }
        addBubble('bot', userError.bubble);
        setStatus(userError.status);
      } finally {
        if (chatRequestTimeoutTimer) {
          window.clearTimeout(chatRequestTimeoutTimer);
        }
        activeRequestController = null;
        // A failed turn may leave a half-spoken streamed reply behind.
        streamedSpeech = null;
        // No gate may outlive its turn: a preface still speaking when the turn
        // ends must not park the next turn's reply behind it.
        prefaceSpeech = null;
        resetSpookyState();
        resetUiState();
        // The turn no longer owns the speaker, so anything the entity said
        // while it did is delivered now -- after the reply's speech and laugh,
        // never over them.
        drainDeferredProactive();
        // Covers the no-audio path (speak replies off, or a text-only turn),
        // where speak() never runs to hand the mic back.
        maybeResumeListening();
      }
    }

    // `autoSendReason` is '' unless this stop is asking for the turn to be sent,
    // in which case it says who asked: 'user' or 'pause'. Every caller that is
    // not a request for the turn passes nothing, and so can never send.
    function resolveRecognitionStopWaiters() {
      const waiters = recognitionStopWaiters;
      recognitionStopWaiters = [];
      waiters.forEach((resolve) => resolve());
    }

    function stopRecording(autoSendReason = '') {
      if (!recognition || !recording) {
        return Promise.resolve();
      }
      recognitionAutoSendReason = String(autoSendReason || '');
      recognitionStopRequested = true;
      cancelSilenceStopTimer();
      cancelRecognitionStallWatchdog();
      cancelRecognitionStopFallback();
      const stopped = new Promise((resolve) => {
        recognitionStopWaiters.push(resolve);
      });
      recognitionStopFallbackTimer = window.setTimeout(() => {
        recognitionStopFallbackTimer = 0;
        if (!recording) {
          return;
        }
        recording = false;
        resolveRecognitionStopWaiters();
        // Only what the microphone heard. The box is the user's, and the engine
        // falling silent while the user is typing must not turn their sentence
        // into a turn of its own.
        const fallbackTranscript = normalizeCapturedTranscript(
          getRecognitionTranscript() || pendingSilenceAutoSendTranscript
        );
        interimRecognitionTranscript = '';
        updateMicButtonState();
        const shouldAutoSendFallback = dictationMayAutoSend(fallbackTranscript, {
          reason: recognitionAutoSendReason,
        });
        recognitionAutoSendReason = '';
        pendingSilenceAutoSendTranscript = '';
        if (shouldAutoSendFallback) {
          void sendMessage(fallbackTranscript, { voiceMode: true });
          return;
        }
        if (!dictationMayPauseAfterSilence()) {
          // Hands-free, and a microphone that stopped answering: the same rule
          // as a session that ended by itself, so this is not a second way for
          // the setting to end up behind a tap.
          scheduleListeningResume();
          return;
        }
        setStatus('Microphone stopped. Tap To Speak to listen again.');
      }, 1500);
      try {
        recognition.stop();
      } catch (error) {
        // A session that was never started has no end event to wait for.
        resolveRecognitionStopWaiters();
        throw error;
      }
      return stopped;
    }

    async function requestMicrophonePermission() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        // Permission granted; release the stream at once. Speech recognition
        // opens its own capture, and a second live capture held open on the same
        // microphone starves it of audio: recognition reports "Listening" but
        // never receives a sample, so speaking louder changes nothing. Nothing
        // in this page reads the stream, so it must be closed before we start.
        stream.getTracks().forEach(track => track.stop());
        return true;
      } catch (error) {
        if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
          setStatus('Microphone access denied. Check browser settings → Privacy & security → Microphone to allow access, then refresh and try again.');
          return false;
        }
        if (error.name === 'NotFoundError') {
          setStatus('No microphone detected. Please connect a microphone and try again.');
          return false;
        }
        if (error.name === 'NotSupportedError') {
          setStatus('Microphone access requires a secure connection (HTTPS or localhost).');
          return false;
        }
        setStatus(`Microphone access error: ${error.message}`);
        return false;
      }
    }

    function isHandsFreeEnabled() {
      return Boolean(handsFreeToggle && handsFreeToggle.checked);
    }

    // The questions the recognition layer asks before it touches the message box.
    // Each one hands its context to a helper and keeps nothing of the rule itself,
    // so the decision has a single definition and a test. Each also carries a
    // branch for a cached older copy of app-helpers.js, which has no opinion: there
    // the page falls back to the rule it had before, which is today's behaviour
    // rather than a broken turn. `dictationMayAutoSend` is the exception, and says
    // why in its own comment: the rule it had before is the fault being fixed.
    function dictationMayWriteToInput() {
      if (typeof mobileChatHelpers.shouldDictateIntoInput !== 'function') {
        return Boolean(recording);
      }
      return mobileChatHelpers.shouldDictateIntoInput({
        recording,
        userOwnsInput: inputOwnedByUser,
      });
    }

    function dictationMayAutoSend(transcript, context) {
      const state = context || {};
      const heard = normalizeCapturedTranscript(transcript);
      if (typeof mobileChatHelpers.shouldAutoSendDictation !== 'function') {
        // A cached older copy of app-helpers.js has no opinion on the reason a
        // turn was asked for, so the rule is spelled out here rather than left to
        // it. Unlike the fallbacks above, this one is deliberately not the older
        // rule: the older rule sent whatever had been heard the moment the engine
        // ended its own session, which it does at every short pause. Falling back
        // to it would restore the fault rather than degrade gracefully.
        return Boolean(heard) && !isSendingMessage && !inputOwnedByUser
          && (state.reason === 'user'
            || (state.reason === 'pause' && autoSendToggle && autoSendToggle.checked));
      }
      return mobileChatHelpers.shouldAutoSendDictation({
        autoSendEnabled: Boolean(autoSendToggle && autoSendToggle.checked),
        reason: String(state.reason || ''),
        sending: isSendingMessage,
        transcript: heard,
        userOwnsInput: inputOwnedByUser,
      });
    }

    function dictationYieldsMicToTyping() {
      if (typeof mobileChatHelpers.shouldYieldMicToTyping !== 'function') {
        return Boolean(recording);
      }
      return mobileChatHelpers.shouldYieldMicToTyping({
        recording,
        userOwnsInput: inputOwnedByUser,
      });
    }

    // What a session that ended with nothing heard does next. Asked separately
    // from the three above because it is not about the message box. The fallback
    // for a cached older copy of app-helpers.js is the rule as it was -- park
    // and wait for a tap -- because that is the behaviour a page that cannot
    // reach the helper is already built around.
    function dictationMayPauseAfterSilence() {
      if (typeof mobileChatHelpers.shouldPauseAfterNoSpeech !== 'function') {
        return true;
      }
      return mobileChatHelpers.shouldPauseAfterNoSpeech({
        handsFree: isHandsFreeEnabled(),
      });
    }

    // Whether an armed silence pause waits again. Asked separately from the four
    // above because it is about the pause, not the message box, and it is the
    // one rule here whose fallback is not merely older behaviour: a cached
    // app-helpers.js without the helper leaves the page ending turns on a quiet
    // transcript, which is exactly the fault this answers.
    function silenceStopShouldKeepWaiting() {
      if (typeof mobileChatHelpers.shouldWaitLongerForSilence !== 'function') {
        return false;
      }
      const waitedMs = silenceStopWaitStartedAtMs ? Date.now() - silenceStopWaitStartedAtMs : 0;
      return mobileChatHelpers.shouldWaitLongerForSilence({
        hearingSpeech: recognitionHearingSpeech,
        waitedMs,
      });
    }

    // The keyboard claiming the message box. Ownership and the microphone go
    // together, and the pairing is one-way on purpose: clearing
    // userStoppedListening is each recording start's own business, because only
    // it knows whether the stop behind it was the user's.
    //
    // They go together because hands-free re-arms the microphone between turns,
    // so a box the keyboard owns would otherwise be a box with a live
    // microphone behind it -- one whose dictation the page has been told not to
    // trust. The box would keep the typed words and silently ignore every word
    // spoken after them.
    function takeMessageBoxFromMicrophone() {
      inputOwnedByUser = true;
      userStoppedListening = true;
    }

    // Hands-free re-arming after a session that heard nothing. Delayed rather
    // than immediate because the microphone has just been released and the next
    // start would race it; every reason to stay quiet is still checked when the
    // timer fires, so a tap, a keystroke or a reply landing in the meantime wins
    // over this.
    function scheduleListeningResume() {
      window.clearTimeout(listeningResumeTimer);
      listeningResumeTimer = window.setTimeout(() => {
        listeningResumeTimer = 0;
        maybeResumeListening();
      }, handsFreeResumeDelayMs);
    }

    function maybeResumeListening() {
      if (recording || !recognition) {
        return;
      }

      // A queued unprompted line owns the hand-over: listening resumes when the
      // queue empties, not between the reply's last word and that line. Without
      // this the microphone is re-armed and set straight back down, which costs
      // a recognizer chime per held line.
      if (deferredProactive.length && proactiveEnabled && speakToggle.checked) {
        return;
      }

      const shouldListen = mobileChatHelpers.shouldResumeListening({
        handsFree: isHandsFreeEnabled(),
        recognitionAvailable: Boolean(recognition),
        sending: isSendingMessage,
        speaking: speakingReply,
        userStopped: userStoppedListening,
        fatalError: fatalMicrophoneError,
      });

      if (!shouldListen) {
        return;
      }

      startRecording();
    }

    function disableHandsFreeForMicrophoneFailure(message) {
      fatalMicrophoneError = true;
      if (handsFreeToggle && handsFreeToggle.checked) {
        handsFreeToggle.checked = false;
        try { window.localStorage.setItem(handsFreeKey, 'false'); } catch (e) {}
      }
      setStatus(message);
    }

    function startRecording() {
      if (!recognition) {
        setStatus('Speech recognition is not available in this browser. Use text input instead.');
        return;
      }

      if (recording) {
        return;
      }

      try {
        recognitionStopRequested = false;
        cancelRecognitionStopFallback();
        recognition.continuous = true;
        recognition.start();
      } catch (error) {
        if (error.name === 'NotAllowedError') {
          setStatus('Microphone access denied. Check browser settings → Privacy & security → Microphone to allow access, then refresh and try again.');
          return;
        }
        if (error.name === 'InvalidStateError') {
          // A start is already on its way to the engine's own start event. Two
          // callers can reach here in the same instant -- speak() and the
          // caller that handed the microphone over for a line both hand it
          // back -- and `recording` stays false until `onstart` arrives, so
          // the second start has nothing to guard on. The first one is the
          // start; this one has no work to do.
          return;
        }
        setStatus(`Unable to start listening: ${error.message}`);
      }
    }

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = getSelectedLanguage();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        cancelRecognitionStopFallback();
        recognitionStopRequested = false;
        recognitionAutoSendReason = '';
        pendingSilenceAutoSendTranscript = '';
        recognitionHearingSpeech = false;
        lastRecognitionError = '';
        // The engine ends a session of its own accord mid-utterance, and the
        // stall watchdog stops it on purpose, so this event also fires for a
        // restart that continues what the user is still saying. Clearing here
        // threw away the words already spoken and the reply answered only the
        // tail of the sentence. A start with nothing being dictated is the only
        // one that begins a fresh transcript.
        //
        // The box is consulted only when the page believes it holds dictation.
        // Text the user typed is not a transcript this session carried over, and
        // emptying the box to start one would delete a sentence mid-keystroke.
        const dictatedSoFar = normalizeCapturedTranscript(
          getRecognitionTranscript() || (inputOwnedByUser ? '' : messageInput.value),
        );
        if (dictatedSoFar) {
          recognitionCarriedTranscript = dictatedSoFar;
        } else if (!inputOwnedByUser) {
          clearRecognitionTranscript(true);
        }
        cancelSilenceStopTimer();
        recording = true;
        // A start that carried words is a continuation, not a fresh turn: the
        // engine ended its own session mid-sentence and the microphone is back to
        // hear the rest. The pause has to be armed here, or a continuation that
        // hears nothing more would never end its turn -- nothing else would start
        // the timer, because the transcript has stopped changing.
        //
        // It is keyed on the recognition transcript and not on the box, so a
        // sentence the user typed can never arm it and be sent as dictation.
        if (getRecognitionTranscript()) {
          scheduleSilenceStop();
        }
        noteRecognitionActivity();
        recognitionStallRecoveryAttempts = 0;
        scheduleRecognitionStallWatchdog();
        updateMicButtonState();
        setStatus('Listening. Speak naturally.');
      };

      // Whether the engine is still hearing the user speak, which is what the
      // silence pause waits on. Recognition results arrive in bursts from a
      // server, so a transcript that has gone quiet says nothing about whether
      // the user has finished; these events do. Both families are paired because
      // browsers implement them unevenly, and the stall watchdog is the backstop
      // for a browser that reports a start and never its end.
      const noteSpeechStarted = () => {
        recognitionHearingSpeech = true;
        cancelSilenceStopTimer();
      };
      const noteSpeechEnded = () => {
        recognitionHearingSpeech = false;
        scheduleSilenceStop();
      };
      recognition.onspeechstart = noteSpeechStarted;
      recognition.onsoundstart = noteSpeechStarted;
      recognition.onspeechend = noteSpeechEnded;
      recognition.onsoundend = noteSpeechEnded;

      recognition.onresult = (event) => {
        lastRecognitionError = '';
        noteRecognitionActivity();
        recognitionStallRecoveryAttempts = 0;
        scheduleRecognitionStallWatchdog();
        const finalizedParts = [];
        const interimParts = [];

        for (const result of Array.from(event.results)) {
          const transcriptPart = (result[0] && result[0].transcript ? result[0].transcript : '').trim();
          if (!transcriptPart) {
            continue;
          }

          if (result.isFinal) {
            finalizedParts.push(transcriptPart);
          } else {
            interimParts.push(transcriptPart);
          }
        }

        finalizedRecognitionTranscript = mobileChatHelpers.mergeDictatedText(
          recognitionCarriedTranscript,
          collapseTranscriptParts(finalizedParts).join(' ').trim(),
        );
        interimRecognitionTranscript = collapseTranscriptParts(interimParts).join(' ').trim();
        const transcript = normalizeCapturedTranscript(getRecognitionTranscript());

        // Writing the transcript is dictation taking the box, so it stops the
        // moment the user types into it. Ambient noise produces an empty
        // transcript, and that empty string would otherwise wipe every character
        // typed so far.
        if (dictationMayWriteToInput()) {
          messageInput.value = transcript;
        }
        setStatus(`Captured: ${transcript || 'no speech detected yet'}`);

        // Avoid resetting the silence timer on duplicate interim results.
        if (transcript && transcript !== lastTranscriptForSilenceTimer) {
          lastTranscriptForSilenceTimer = transcript;
          scheduleSilenceStop();
        }
      };

      recognition.onerror = (event) => {
        noteRecognitionActivity();
        lastRecognitionError = event.error || '';
        if (event.error === 'aborted') {
          return;
        }

        let errorMessage = `Speech recognition error: ${event.error}`;
        let isFatal = false;
        if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
          errorMessage = 'Microphone access denied. Go to Edge settings → Privacy & security → Microphone, make sure speech recognition is allowed for this site, then refresh and try again.';
          isFatal = true;
        } else if (event.error === 'network') {
          errorMessage = 'Network error. Check your internet connection and try again.';
        } else if (event.error === 'no-speech') {
          errorMessage = 'No speech detected. Speak clearly into your microphone and try again.';
        } else if (event.error === 'audio-capture') {
          errorMessage = 'Microphone error. Check that your microphone is working and not in use by another app.';
          isFatal = true;
        }

        if (isFatal) {
          // Retrying cannot fix these, so stop hands-free from looping on them.
          disableHandsFreeForMicrophoneFailure(errorMessage);
          return;
        }
        setStatus(errorMessage);
      };

      recognition.onend = () => {
        cancelRecognitionStopFallback();
        cancelSilenceStopTimer();
        cancelRecognitionStallWatchdog();
        const stopWasRequested = recognitionStopRequested;
        const autoSendReason = recognitionAutoSendReason;
        recognitionStopRequested = false;
        recognitionAutoSendReason = '';
        recording = false;
        resolveRecognitionStopWaiters();
        // What the microphone heard, never what is in the box: a dropout with
        // nothing heard used to pick up the user's half-typed sentence from
        // `messageInput.value` and send it as a turn, clearing the box under
        // their hands. It is also why `sendMessage` is called with the
        // transcript rather than left to read the box itself.
        const liveTranscript = normalizeCapturedTranscript(getRecognitionTranscript());
        interimRecognitionTranscript = '';
        const transcript = liveTranscript || pendingSilenceAutoSendTranscript;
        pendingSilenceAutoSendTranscript = '';
        recognitionHearingSpeech = false;
        updateMicButtonState();
        // `autoSendReason` is empty when nobody ended this session on purpose --
        // the engine dropped it at a short silence, which it does mid-sentence.
        // That is a pause in the utterance rather than the end of it, so nothing
        // is sent and the fall-through puts the microphone back to hear the rest.
        if (dictationMayAutoSend(transcript, { reason: autoSendReason })) {
          void sendMessage(transcript, { voiceMode: true });
          return;
        }
        if (!stopWasRequested && !transcript) {
          // The microphone heard nothing. Without hands-free that is where it
          // stays: starting it again would chime and hear nothing again, which
          // is the loop this replaced, so it waits for a tap or a real
          // utterance. Hands-free is the setting that says the microphone never
          // goes off, and the engine ends a session of its own accord after
          // every pause -- parking there is what made every silence a manual
          // restart, so it re-arms instead.
          if (dictationMayPauseAfterSilence()) {
            userStoppedListening = true;
            setStatus('Paused after no speech. Tap To Speak when you are ready.');
            return;
          }
          scheduleListeningResume();
          return;
        }
        // Recognition drops out on its own after a pause. In hands-free mode
        // that should put us straight back into listening, not stop the turn.
        if (transcript && !isHandsFreeEnabled()) {
          // Nothing was sent and the microphone is not coming back on by itself,
          // so the words stay where they are and the page says why rather than
          // falling silent. Two ways to arrive here: the engine dropped its own
          // session, which is a pause mid-sentence, and a pause the auto-send
          // toggle vetoed, which is a stop the user asked for.
          setStatus(stopWasRequested
            ? 'Microphone stopped. Tap To Speak to listen again.'
            : 'Paused mid-sentence. Tap To Speak to carry on, or press Send.');
          return;
        }
        maybeResumeListening();
      };
    } else {
      micButton.disabled = true;
      setStatus('Speech recognition is not available in this browser. Text chat is still available.');
    }

    if ('speechSynthesis' in window) {
      populateBrowserVoices();
      window.speechSynthesis.onvoiceschanged = populateBrowserVoices;
      window.setTimeout(populateBrowserVoices, 1200);
    }

    countrySelect.addEventListener('change', () => {
      lastRenderedVoicesHash = '';
      persistSelectedCountry();
      // The character does not survive a country change: a character belongs to
      // the country that offers it, so carrying the old one over would select
      // somebody this country does not have.
      window.localStorage.removeItem(voiceStorageKey);
      void loadCharactersForCountry(countrySelect.value);
    });

    voiceSelect.addEventListener('change', () => {
      persistSelectedVoice();
      syncRecognitionLanguage();
      const selectedVoice = getSelectedVoice();
      renderCharacterInfo();
      if (selectedVoice) {
        setStatus(`Character set to ${mobileChatHelpers.buildCharacterOptionLabel(selectedVoice)}.`);
      }
    });

    languageSelect.addEventListener('change', async (event) => {
      applySelectedLanguage(event.target.value);
      persistSelectedLanguage();
      syncRecognitionLanguage();
      window.localStorage.removeItem(voiceStorageKey);
      // Characters are per language, so the accumulated cache no longer applies.
      characterCache.clear();
      populateBrowserVoices();
      await loadCharacterPicker();
      setStatus(`${getSelectedLanguageLabel()} listening enabled. Replies stay in that language unless you ask otherwise.`);
    });

    deliveryStyleSelect.addEventListener('change', (event) => {
      setDeliveryStyle(event.target.value);
    });

    modelSelect.addEventListener('change', async (event) => {
      const selectedModel = event.target.value;
      const selectedIndex = event.target.selectedIndex;
      if (selectedModel) {
        setStatus(`Model selected: ${selectedModel}`);
      }
      // Save the selected index
      fetch('/api/set-last-model-index', {
        method: 'POST',
        headers: buildJsonHeaders(),
        body: JSON.stringify({ index: selectedIndex })
      }).catch(err => console.error('Failed to save model index:', err));
    });

    passwordInput.addEventListener('input', () => {
      if (!mcpAccessToken) {
        return;
      }
      clearMcpAccessToken();
      setStatus('Protected-access token cleared. Enter the password again to unlock protected actions.');
    });

    passwordInput.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter') {
        return;
      }
      event.preventDefault();
      void unlockMcpAccess();
    });

    sendPasswordButton.addEventListener('click', (event) => {
      event.preventDefault();
      void unlockMcpAccess();
    });

    if (restartBotButton) {
      restartBotButton.addEventListener('click', (event) => {
        event.preventDefault();
        void restartTheEntityInTheShed();
      });
    }

    window.addEventListener('pageshow', () => {
      loadStoredDeliveryStyle();
      syncRecognitionLanguage();
      populateBrowserVoices();
      void loadCharacterPicker();
    });

    // Persist spooky toggle changes
    if (spookyFartsToggle) {
      spookyFartsToggle.addEventListener('change', () => {
        try { window.localStorage.setItem(spookyFartsKey, spookyFartsToggle.checked ? 'true' : 'false'); } catch (e) {}
      });
    }
    if (spookyLaughsToggle) {
      spookyLaughsToggle.addEventListener('change', () => {
        try { window.localStorage.setItem(spookyLaughsKey, spookyLaughsToggle.checked ? 'true' : 'false'); } catch (e) {}
      });
    }
    if (textReportFormatToggle) {
      textReportFormatToggle.addEventListener('change', () => {
        try { window.localStorage.setItem(textReportFormatKey, textReportFormatToggle.checked ? 'true' : 'false'); } catch (e) {}
      });
    }
    // Persist speak & auto-send toggles
    if (speakToggle) {
      speakToggle.addEventListener('change', () => {
        try { window.localStorage.setItem(speakToggleKey, speakToggle.checked ? 'true' : 'false'); } catch (e) {}
      });
    }
    if (autoSendToggle) {
      autoSendToggle.addEventListener('change', () => {
        try { window.localStorage.setItem(autoSendKey, autoSendToggle.checked ? 'true' : 'false'); } catch (e) {}
      });
    }

    // The one toggle that is not a browser preference: whether the entity may
    // speak unprompted is a fact about the server's silence policy, so this
    // asks the server and shows its answer rather than storing a local wish.
    if (proactiveToggle) {
      proactiveToggle.addEventListener('change', async () => {
        const wanted = proactiveToggle.checked;
        // Local first, so the stream and the poll answer to the click at once.
        // The server's reply is what the box is then set back to, so a refusal
        // shows as the box springing back rather than as a setting that only
        // looks applied.
        proactiveEnabled = wanted;
        if (!wanted) {
          // Switching the chatterbox off silences what was waiting for the
          // speaker as well, rather than letting it land a turn later.
          dropDeferredProactive();
        }
        refreshProactiveDelivery();

        try {
          const response = await fetch('/api/entity/proactive', {
            method: 'POST',
            headers: buildJsonHeaders(),
            body: JSON.stringify({ client_id: clientId, enabled: wanted }),
          });
          const payload = await response.json();
          if (!response.ok || !payload.ok) {
            throw new Error((payload && payload.error) || 'the switch did not stick');
          }
          adoptClientIdentity(payload);
          setStatus(wanted
            ? `Chatterbox mode on: ${getAssistantName()} may speak up unprompted.`
            : `Chatterbox mode off: ${getAssistantName()} will only reply.`);
        } catch (error) {
          proactiveEnabled = !wanted;
          proactiveToggle.checked = !wanted;
          refreshProactiveDelivery();
