[workspace]
resolver = "3"
members = ["crates/*", "bins/shed-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

# Dependency direction is fixed by docs/ARCHITECTURE.md (plan §3.3). A crate lists
# only the crates it is allowed to depend on; the layering test enforces it.
[workspace.dependencies]
shed-config = { path = "crates/shed-config" }
shed-json = { path = "crates/shed-json" }
shed-text = { path = "crates/shed-text" }
shed-store = { path = "crates/shed-store" }
shed-logging = { path = "crates/shed-logging" }
shed-models = { path = "crates/shed-models" }
shed-llm = { path = "crates/shed-llm" }
shed-prompts = { path = "crates/shed-prompts" }
shed-characters = { path = "crates/shed-characters" }
shed-conversation = { path = "crates/shed-conversation" }
shed-chat = { path = "crates/shed-chat" }
shed-tools = { path = "crates/shed-tools" }
shed-mcp = { path = "crates/shed-mcp" }
shed-tts = { path = "crates/shed-tts" }
shed-entity = { path = "crates/shed-entity" }
shed-mind = { path = "crates/shed-mind" }
shed-http = { path = "crates/shed-http" }
shed-testutil = { path = "crates/shed-testutil" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "sync", "process", "signal"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "stream"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
rand = "0.9"
regex = "1"
futures = "0.3"
tokio-tungstenite = "0.24"
rmcp = { version = "1", features = ["client-transport", "transport-io"] }
windows = { version = "0.61", features = ["Media_SpeechSynthesis", "Storage_Streams", "Foundation_Collections", "Graphics_Imaging", "Win32_Foundation", "Win32_System_Com"] }
keyring = "3"

# A lint group and a lint from that group may not share a priority, so the groups sit at
# priority -1 and every individual setting below overrides them at the default priority.
[workspace.lints.rust]
unused = { level = "deny", priority = -1 }
dead_code = "deny"
unused_crate_dependencies = "deny"
missing_debug_implementations = "warn"
# `deny`, not `forbid`: shed-tts's Windows SAPI binding is the one place unsafe
# is unavoidable, and that crate carries the written justification.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -2 }
# The stage gate runs clippy with `-D warnings`, which turns any warn-level group into a
# failure. So the pedantic group is left off as a whole and the handful of its lints that
# this project actually wants are named below, each with a reason.
pedantic = { level = "allow", priority = -2 }
# How_To_Code.md principle 5: a function over 50 lines is reviewed. clippy.toml
# sets the threshold; an exception needs #[allow(clippy::too_many_lines)] plus a
# written justification, which the stage gate reviews.
too_many_lines = "deny"
await_holding_lock = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
expect_used = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
# Left off: this lint fires on ordinary index arithmetic (`&line[at + 1..]`), which is
# everywhere in text and JSON handling. Overflow risk on externally supplied numbers is
# covered by the ported Python tests instead, and any place that parses a number from a
# client is reviewed for it explicitly.
arithmetic_side_effects = "allow"
