# Workspace root for the Rust clone of Entity In The Shed.
#
# Crates are created on demand: a crate appears in `crates/` only when a stage
# gives it a production caller (plan decision D4, How_To_Code principle 16).
# The complete layer map lives in crates/shed-gates/src/layers.rs and the
# layering gate enforces it over whatever packages exist today.
[workspace]
resolver = "2"
members = ["crates/*", "bins/*"]

# Only dependencies with a live consumer are listed here; later stages add
# theirs as they write the code that uses them (principle 16). Each entry
# names its consumer.
[workspace.dependencies]
axum = "0.8"            # shed-http: router + /health; shed-server: serve
# shed-conversation: the stored stamps are ISO-8601 with an optional offset, and Python's
# `fromisoformat` accepts a grammar rather than one format string. chrono's parse ladder,
# `FixedOffset` and `NaiveDateTime` are what slice 4b's `timestamp.rs` builds on. This is the
# workspace's first date/time dependency, added with its first consumer (principle 16).
# `default-features = false` drops `clock` and `wasmbind`: the crate never reads the wall clock
# (every "now" arrives as an argument), so it needs neither `Local::now` nor a system clock.
chrono = { version = "0.4", default-features = false, features = ["std"] }
fancy-regex = "0.20"    # shed-models: the name-size pattern needs a lookbehind, which `regex`'s RE2 cannot express
http-body-util = "0.1"  # shed-http tests: collect the response body
rand = "0.9"            # shed-llm: `random.randint(0, LM_ENGINE_RETRY_JITTER_MS)`, the wait's jitter
# `default-features = false` because the defaults pull in `charset` (a charset sniffer no shed
# response needs — every body here is UTF-8 JSON), `http2` (the engine is an HTTP/1.1 server), and
# `system-proxy` (a Windows registry proxy lookup that would send a local engine's traffic through
# whatever the machine is configured for). `gzip` replaces `requests`' own `Accept-Encoding: gzip,
# deflate` (`agent.py:1549`, `1176`); `stream` is the response-body streaming the SSE reader reads
# an engine's reply off (`agent.py:1176`'s `stream=True`); `json` is the `json=payload` argument the
# streamed chat POST passes (`agent.py:1172`), which serialises the body and sets its content type
# the same way `requests` does; `rustls-tls-native-roots` is `requests`'
# certificate trust, from the OS store rather than a bundled set, so an `https` `LM_ENGINE_HOST` is
# as reachable here as it is in the source.
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "stream", "rustls-tls-native-roots"] } # shed-llm: the engine transport
serde = { version = "1", features = ["derive"] } # shed-gates: manifest + layer model; shed-http: query args
serde_json = "1"        # shed-config: JSON env values; shed-text: Python `str()` over values; shed-http: /health payload; shed-conversation: profile.rs reads whatever the model returned as one `Value`
sha2 = "0.10"           # shed-gates: frozen-asset manifest
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] } # shed-server: runtime + bind + raw smoke socket + ctrl-c; shed-llm: the retry ladder's sleep
tower = { version = "0.5", features = ["util"] } # shed-http tests: oneshot the router
toml = "0.8"            # shed-gates: reads each crate's Cargo.toml
tracing = "0.1"         # shed-logging + every crate's app lines
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] } # shed-logging

# `v4` is what `uuid4()` needs: `agent.py:982`'s `uuid4().hex` is the id a boot prints in brackets
# before there is a request to read one off.
uuid = { version = "1", features = ["v4"] } # shed-llm: request_id.rs

[workspace.package]
version = "0.1.0"
edition = "2021"

# Deny-by-default floor for every crate in the workspace (principle 16).
# `clippy::pedantic` is deliberately NOT enabled as a group — it would import
# lints this project does not want; wanted pedantic lints are named one by one
# as stages earn them.
[workspace.lints.rust]
dead_code = "deny"
unused = "deny"
unused_crate_dependencies = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
too_many_lines = "deny"      # paired with clippy.toml too-many-lines-threshold
