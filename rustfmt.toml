max_width = 100
tab_spaces = 4
edition = "2024"
# Every width heuristic is set by hand below rather than left at the default, so line
# breaks stay identical across the workspace instead of depending on a per-item budget.
use_small_heuristics = "Max"
single_line_if_else_max_width = 60

# Deliberately absent: `normalize_comments` and `wrap_comments` are nightly-only, and the
# workspace formats on stable rustfmt.
